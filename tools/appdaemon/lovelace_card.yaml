# Paste as a card into any Lovelace dashboard/view. Two buttons, one per host.
# Feedback (success or failure) arrives as a persistent notification in HA, since
# the sync runs in the background and a button press alone wouldn't otherwise
# tell you anything.
type: entities
title: HA config → GitHub
entities:
  - entity: script.ha_config_sync_pamba
    name: "Sync pamba"
    icon: mdi:raspberry-pi
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.ha_config_sync_pamba
  - entity: script.ha_config_sync_tanga
    name: "Sync tanga"
    icon: mdi:raspberry-pi
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.ha_config_sync_tanga
