set_growatt_sph_mode_with_retry:
  alias: Set Growatt SPH Mode with Retry
  mode: single
  fields:
    expected_mode:
      description: Expected inverter mode/state, e.g. "Battery first".
      example: Battery first
      required: true
  variables:
    mqtt_topic: solar_assistant/inverter_1/work_mode_priority/set
    max_attempts: 3
    delay_seconds: 8
  sequence:
  - variables:
      attempt: 0
  - repeat:
      until:
      - condition: template
        value_template: '{{ states(''sensor.growatt_sph_device_mode'') == expected_mode
          or repeat.index >= max_attempts }}'
      sequence:
      - data:
          topic: '{{ mqtt_topic }}'
          payload: '{{ expected_mode }}'
          qos: 1
        action: mqtt.publish
      - wait_for_trigger:
        - entity_id: sensor.growatt_sph_device_mode
          to: '{{ expected_mode }}'
          trigger: state
        timeout:
          seconds: '{{ delay_seconds }}'
        continue_on_timeout: true
  description: ''
set_growatt_mode_from_dropdown:
  alias: Set Growatt Mode From Dropdown
  sequence:
  - data:
      expected_mode: '{{ states(''input_select.inverter_mode'') }}'
    action: script.set_growatt_sph_mode_with_retry
  description: ''
take_calibration_snapshot:
  alias: Take Calibration Snapshot
