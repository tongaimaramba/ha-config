manage_guest_access:
  alias: manage_guests
  icon: mdi:account
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.guest_access
        state: Add
      sequence:
      - data_template:
          message: 'the guest: {{states(''input_text.guest_name'')}} with MAC {{states(''input_text.mac_addr'')}}
            as {{states(''input_select.relationship'')}} just created'
        service: notify.all_android
      - data:
          value: 2
        entity_id: input_number.monitor_action
        service: input_number.set_value
      - event: run_guest_access
        event_data:
          name: run_guest_access
    - conditions:
      - condition: state
        entity_id: input_select.guest_access
        state: Remove
      sequence:
      - data_template:
          message: 'the guest: {{states(''input_text.guest_name'')}} with MAC {{states(''input_text.mac_addr'')}}
            as {{states(''input_select.relationship'')}} just removed'
        service: notify.all_android
      - data:
          value: 1
        entity_id: input_number.monitor_action
        service: input_number.set_value
      - event: run_guest_access
        event_data:
          name: run_guest_access
    default:
    - data_template:
        message: No action selected so nothing done. Select from "Add" or "Remove"
          and resubmit
      service: notify.all_android
    - data:
        value: 0
      entity_id: input_number.monitor_action
      service: input_number.set_value
# Bathtime On / Off removed 2026-11-08 (backlog 5, G5): disabled on tanga since Aug 2024 (unknown device
# ef52ca73..., the old bathroom sink light; three of its four lights and climate.upstairs no longer exist here).
# Lighting and heating are pamba's (OWNERSHIP); pamba keeps its identical copy. Manual fallback: wall switches
# and tado's own dials/app.
relaunch_apps:
  alias: Relaunch Apps
  sequence:
  - service: input_boolean.toggle
    data_template:
      entity_id: input_boolean.relaunch
  mode: single
  icon: mdi:rocket
lock_nuki_momentary:
  alias: Lock Nuki - momentary
  sequence:
  - service: switch.turn_on
    data: {}
    target:
      entity_id: switch.lock_nuki
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.lock_nuki
  mode: single
  icon: 'mdi: lock'
unlock_nuki_momentary:
  alias: Unlock Nuki - momentary
  sequence:
  - service: switch.turn_on
    data: {}
    target:
      entity_id: switch.unlock_nuki
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.unlock_nuki
  mode: single
  icon: mdi:unlock
open_nuki_momentary:
  alias: Open Nuki - momentary
  sequence:
  - service: switch.turn_on
    data: {}
    target:
      entity_id: switch.open_nuki
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.open_nuki
  mode: single
  icon: mdi:door-open
movie_lights:
  alias: Movie Lights
  sequence:
  - service: light.turn_off
    data: {}
    target:
      entity_id:
      - light.movie_lamp
      - light.dining_spotlights_3
      - light.lounge_lamp_1
  mode: single
  icon: mdi:movie
home_fires:
  alias: Home Fires
  sequence:
  - service: light.turn_off
    data: {}
    target:
      entity_id: group.downstairs_lights
  - service: light.turn_on
    data:
      brightness_pct: 10
    target:
      entity_id:
      - light.movie_lamp
  mode: single
  icon: mdi:candle
nearly_home:
  alias: Nearly Home
  sequence:
  - service: input_boolean.turn_on
    data: {}
    target:
      entity_id: input_boolean.nearly_home
  - service: input_boolean.turn_off
    data: {}
    target:
      entity_id: input_boolean.away_on_holiday
  mode: single
  icon: mdi:road
change_sound_output:
  alias: change sound output
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.audio_switch
        state: 'on'
      sequence:
      - service: webostv.select_sound_output
        data:
          entity_id: media_player.projector
          sound_output: soundbar
    - conditions:
      - condition: state
        entity_id: input_boolean.audio_switch
        state: 'off'
      sequence:
      - service: webostv.select_sound_output
        metadata: {}
        data:
          entity_id: media_player.projector
          sound_output: headphone
  mode: single
  icon: mdi:speaker
downstairs_lights_off:
  alias: Downstairs Lights Off
  sequence:
  - metadata: {}
    data: {}
    target:
      entity_id:
      - light.downstairs_lights
      - light.movie_lamp
      - light.study_desk_lamp
    action: light.turn_off
  - metadata: {}
    data: {}
    target:
      entity_id: switch.sonoff_lights
    action: switch.turn_off
  mode: single
  icon: mdi:light-switch
fp_delete_fingerprint:
  alias: Delete Single Fingerprint
  sequence:
  - action: esphome.fp_delete_fingerprint
    data:
      finger_id: '{{ states(''input_number.fp_enroll_id'') | int }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.fp_metadata
    data:
      value: '{% set fid = states(''input_number.fp_enroll_id'') | string %} {% set
        current = states(''input_text.fp_metadata'') %} {{ current.split('';'') |
        reject(''match'', ''^'' ~ fid ~ '':'') | join('';'') }}'
fp_delete_all_fingerprints:
  alias: Delete All Fingerprints
  sequence:
  - action: esphome.fp_delete_all_fingerprints
    data: {}
  - target:
      entity_id: input_text.fp_metadata
    data:
      value: ''
    action: input_text.set_value
fp_enroll_fingerprint:
  sequence:
  - action: esphome.fp_enroll
    data:
      finger_id: '{{ states(''input_number.fp_enroll_id'') | int }}'
      num_scans: '{{ states(''input_number.fp_enroll_scans'') | int }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.fp_metadata
    data:
      value: "{% set current = states('input_text.fp_metadata') %} {% set new_entry
        = [\n  states('input_number.fp_enroll_id'),\n  states('input_text.fp_enroll_name'),\n
        \ states('input_text.fp_enroll_finger')\n] | join(':') %} {{ current ~ ';'
        ~ new_entry if current != '\"\"' else new_entry }}"
  alias: fp_enroll_fingerprint
fp_reset:
  sequence:
  - action: esphome.fp_reset_lockout
    metadata: {}
    data: {}
  alias: fp reset
  description: ''
auto_allocate_fingerprint_id:
  alias: Auto-select Next Fingerprint ID
  sequence:
  - variables:
      used_ids: "{% set store = states('input_text.fp_metadata_store') %} {% set ns
        = namespace(id_list=[]) %} {% if store %}\n  {% for record in store.split(';')
        if record %}\n    {% set parts = record.split(':') %}\n    {% if parts|length
        >= 1 %}\n      {# Extract ID from first part #}\n      {% set id_candidate
        = parts[0] | int(default=0) %}\n      {% if 1 <= id_candidate <= 127 %}\n
        \       {% if id_candidate not in ns.id_list %}\n          {% set ns.id_list
        = ns.id_list + [id_candidate] %}\n        {% endif %}\n      {% endif %}\n
        \   {% endif %}\n  {% endfor %}\n{% endif %} {{ ns.id_list | sort }}"
      next_id: "{% set id_set = used_ids | list %}  {# Convert to list #} {% for i
        in range(1, 128) %}\n  {% if i not in id_set %}\n    {{ i }}\n    {% break
        %}\n  {% elif loop.last %}\n    0\n  {% endif %}\n{% endfor %}"
  - condition: '{{ next_id | int > 0 }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.fp_enroll_id
    data:
      value: '{{ next_id }}'
  - action: notify.mobile_app_tongai_s22
    data:
      message: "\U0001F513 Fingerprint ID Selected: {{ next_id }}\n\U0001F4CA Currently
        Used IDs: {{ used_ids }}\n✅ Ready for enrollment\n"
    enabled: false
  description: ''
debug_fingerprint_id_parser:
  alias: Enhanced Debug Fingerprint ID Parser
  sequence:
  - variables:
      sensor1_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_1'') }}'
      sensor2_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_2'') }}'
      sensor3_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_3'') }}'
      test_parsing: '{% set test_string = "1:wwwww:Left Index" %} {% set entry = test_string.split('':'')
        %} Step1_split: {{ entry }} | Step2_first_part: ''{{ entry[0] }}'' | Step3_is_decimal:
        {{ entry[0].isdecimal() }} | Step4_as_int: {{ entry[0] | int }} | Step5_in_range:
        {{ 1 <= (entry[0] | int) <= 127 }}'
      used_ids: "{% set ns = namespace(ids=[]) %} {% for part in \n    states('sensor.fp_auth_fingerprint_metadata_part_1').split(';')
        +\n    states('sensor.fp_auth_fingerprint_metadata_part_2').split(';') +\n
        \   states('sensor.fp_auth_fingerprint_metadata_part_3').split(';') \n%}\n
        \ {% if part.strip() != '' and ':' in part %}\n    {% set entry = part.strip().split(':')
        %}\n    {% if entry|length >= 1 and entry[0].isdecimal() %}\n      {% set
        id_candidate = entry[0] | int %}\n      {% if 1 <= id_candidate <= 127 and
        id_candidate not in ns.ids %}\n        {% set ns.ids = ns.ids + [id_candidate]
        %}\n      {% endif %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {{ ns.ids
        | sort }}"
      next_id: "{% for i in range(1, 128) %}\n  {% if i not in used_ids %}\n    {{
        i }}\n    {% break %}\n  {% elif loop.last %}\n    0\n  {% endif %}\n{% endfor
        %}"
  - action: notify.mobile_app_tongai_s22
    data:
      message: "\U0001F50D ENHANCED DEBUG RESULTS:\n\n\U0001F4CA Raw Sensors:\n• Sensor
        1: '{{ sensor1_raw }}'\n• Sensor 2: '{{ sensor2_raw }}'\n• Sensor 3: '{{ sensor3_raw
        }}'\n\n\U0001F9EA Test Parsing: {{ test_parsing }}\n\n✅ Used IDs Found: {{
        used_ids }}\n\U0001F3AF Next Available ID: {{ next_id }}\n\n\U0001F4DD All
        Split Parts: {{ \n  states('sensor.fp_auth_fingerprint_metadata_part_1').split(';')
        +\n  states('sensor.fp_auth_fingerprint_metadata_part_2').split(';') +\n  states('sensor.fp_auth_fingerprint_metadata_part_3').split(';')
        \n}}\n"
manage_fp_metadata:
  alias: Manage FP Metadata
  description: "Add, update, or delete a fingerprint record in input_text.fp_metadata_store.
    \n\nUsage:\n  - service: script.manage_fp_metadata\n    data: \n      action:
    \"add\"  or \"update\" or \"delete\"\n      record: \"4:Sam:LeftThumb\"   #For
    add/update\n      record_id: \"4\"                           # For update/delete\n"
  fields:
    action:
      description: add, update, or delete
      example: add
    record:
      description: Record string in format id:name:finger (for add/update)
      example: 4:Sam:LeftThumb
    record_id:
      description: ID of record to update/delete
      example: '4'
  sequence:
  - variables:
      store: '{{ states(''input_text.fp_metadata_store'') }}'
      records: '{{ store.split('';'') if store else [] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''add'' }}'
      sequence:
      - variables:
          filtered: '{{ records | reject(''match'', ''^'' ~ record.split('':'')[0]
            ~ '':'') | list }}'
          new_records: '{{ filtered + [record] }}'
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ new_records | join('';'') }}'
        action: input_text.set_value
    - conditions:
      - condition: template
        value_template: '{{ action == ''update'' }}'
      sequence:
      - variables:
          updated: '{{ records | map(''regex_replace'', ''^'' ~ record_id ~ '':.*'',
            record) | list }}

            '
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ updated | join('';'') }}'
        action: input_text.set_value
    - conditions:
      - condition: template
        value_template: '{{ action == ''delete'' }}'
      sequence:
      - variables:
          filtered: '{{ records | reject(''match'', ''^'' ~ record_id ~ '':'') | list
            }}'
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ filtered | join('';'') }}'
        action: input_text.set_value
# Sets the inverter's work mode and checks it took; the Battery First Scheduler, the Export optimiser and the watchdog
# (packages/solar_health.yaml) call it. M5 step 7 (M5-I D, after the 3 Nov incident): by the inverter's own time slots,
# over Modbus (packages/solar_modbus.yaml), as SolarAssistant did; never by writing 1044 (read only; it reverts).
#   Battery first: Grid First slot 1 off (1082 = 0), AC charge on (1092 = 1), Battery First slot 1 start = now (1100),
#     end = the backstop (1101), on (1102 = 1). Stop SOC (1091) left as is.
#   Grid first: Battery First slot 1 off (1102 = 0), Grid First slot 1 start = now (1080), end (1081), on (1082 = 1).
#   Load first: both slots off (1102 = 0, 1082 = 0).
# Times are hour × 256 + minute on the inverter's clock (sensor.sph_clock_drift watches it). Start is now to the
# minute, cut down (never a minute ahead). The backstop end (`until`, HH:MM) is enforced by the inverter even if HA or
# the link dies: Battery first defaults to 05:30 (the cheap rate's end), Grid first to an hour on; HA ends early with
# Load first or extends by asking again. Refused before anything is recorded or written, each firing
# solar_mode_change_failed with a reason: Modbus writes off; an unknown mode; a bad window (Battery first over 8 h, Grid
# first over 16 h, or empty); Battery first starting outside the cheap rate (23:30-05:30) unless an Intelligent Octopus
# dispatch is on (the whole home is at the cheap rate then); a request older than 2 min, or whose time has no zone
# ("expired": a late or replayed command never acts; on 3 Nov a stale 03:00 Battery first ran at 07:21 by day). The
# other mode's slot is always off before one is turned on: the inverter refuses overlapping slots.
# Read-back: 1044 (sensor.sph_device_mode), the slot enables (sensor.sph_slot_mode), the slot's end and AC charge must
# all match the request; set up that way already: nothing to do. The request is kept in input_text.solar_mode_requested
# for the watchdog. Settings are a sequence step, so a caller can't override them.
# Manual fallback: ShinePhone (work mode / time slots).
set_growatt_sph_mode_with_retry:
  alias: Set Growatt SPH Mode with Retry
  mode: single
  fields:
    expected_mode:
      description: Inverter mode, "Battery first", "Grid first" or "Load first".
      example: Battery first
      required: true
    until:
      description: Backstop end HH:MM for Battery first (default 05:30) or Grid first (default an hour on).
      example: "05:30"
    requested_at:
      description: When the request was made (ISO with a zone); default now. Older than 2 min, it is dropped.
    source:
      description: Who asked; "watchdog" when the watchdog made the request.
  sequence:
  - variables:
      modes: [Load first, Battery first, Grid first]
      max_attempts: 3
      delay_seconds: 12  # the forced read-back reschedules the 10 s poll
      max_age_seconds: 120
      max_window_minutes: {Battery first: 480, Grid first: 960}
      dispatching: binary_sensor.octopus_energy_00000000_0009_4000_8020_000000069f30_intelligent_dispatching
      asked_at: '{{ requested_at if requested_at is defined and requested_at else now().isoformat() }}'
      asked_by: '{{ source if source is defined and source else ''caller'' }}'
      start_hm: '{{ now().strftime(''%H:%M'') }}'
      end_hm: >-
        {%- if until is defined and until -%}{{ until }}
        {%- elif expected_mode == 'Battery first' -%}05:30
        {%- elif expected_mode == 'Grid first' -%}{{ (now() + timedelta(minutes=60)).strftime('%H:%M') }}
        {%- endif -%}
  - variables:
      start_reg: '{{ (start_hm[:2] | int(0)) * 256 + (start_hm[3:] | int(0)) }}'
      end_reg: '{{ (end_hm[:2] | int(0)) * 256 + (end_hm[3:] | int(0)) }}'
      window_minutes: >-
        {{ ((end_hm[:2] | int(0)) * 60 + (end_hm[3:] | int(0)) - (start_hm[:2] | int(0)) * 60 - (start_hm[3:] | int(0))) % 1440 }}
      cheap_now: "{{ start_hm >= '23:30' or start_hm < '05:30' or is_state(dispatching, 'on') }}"
  - variables:
      window_ok: >-
        {{ expected_mode == 'Load first'
           or (end_hm is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
               and 0 < window_minutes <= max_window_minutes.get(expected_mode, 0)) }}
  - if:
    - condition: state
      entity_id: input_boolean.solar_modbus_writes_enabled
      state: 'off'
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }}'
        attempts: 0
        reason: Modbus writes are off
    - stop: Modbus writes are off
  - if:
    - condition: template
      value_template: '{{ expected_mode not in modes }}'
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }}'
        attempts: 0
        reason: unknown mode
    - stop: unknown mode
  - if:
    - condition: template
      value_template: '{{ not window_ok }}'
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }}'
        attempts: 0
        reason: 'bad window {{ start_hm }}-{{ end_hm }}'
    - stop: bad window
  # never grid-charge at the day rate (review of 4186206: a charging-window flag left on asked for it by day)
  - if:
    - condition: template
      value_template: "{{ expected_mode == 'Battery first' and not cheap_now }}"
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }}'
        attempts: 0
        reason: 'outside the cheap rate ({{ start_hm }})'
    - stop: outside the cheap rate
  # a command never acts late, and an expired one is never recorded (else the watchdog would re-apply it)
  - if:
    - condition: template
      value_template: >-
        {% set t = as_datetime(asked_at, none) %}
        {{ t is none or t.tzinfo is none or (now() - t).total_seconds() > max_age_seconds }}
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }}'
        attempts: 0
        reason: expired
    - stop: expired
  # what HA wants from now: sensor.sph_mode_wanted and the watchdog read it (survives a restart)
  - action: input_text.set_value
    target:
      entity_id: input_text.solar_mode_requested
    data:
      value: '{{ expected_mode }}|{{ asked_at }}|{{ end_hm }}|{{ asked_by }}'
  # already set up that way (mode, slots, end and AC charge): nothing to write
  - if:
    - condition: template
      value_template: >-
        {{ states('sensor.sph_device_mode') == expected_mode and states('sensor.sph_slot_mode') == expected_mode
           and (expected_mode == 'Load first'
                or (expected_mode == 'Battery first'
                    and states('sensor.sph_battery_first_slot_1_end_raw') | int(-1) == end_reg
                    and states('sensor.sph_ac_charge_raw') | int(-1) == 1)
                or (expected_mode == 'Grid first'
                    and states('sensor.sph_grid_first_slot_1_end_raw') | int(-1) == end_reg)) }}
    then:
    - stop: already in that mode
  - repeat:
      until:
      - condition: template
        value_template: >-
          {{ (states('sensor.sph_device_mode') == expected_mode and states('sensor.sph_slot_mode') == expected_mode
              and (expected_mode == 'Load first'
                   or (expected_mode == 'Battery first'
                       and states('sensor.sph_battery_first_slot_1_end_raw') | int(-1) == end_reg
                       and states('sensor.sph_ac_charge_raw') | int(-1) == 1)
                   or (expected_mode == 'Grid first'
                       and states('sensor.sph_grid_first_slot_1_end_raw') | int(-1) == end_reg)))
             or repeat.index >= max_attempts }}
      sequence:
      # and not on a retry either: more than 2 min after it was asked, it is dropped
      - if:
        - condition: template
          value_template: >-
            {% set t = as_datetime(asked_at, none) %}
            {{ t is none or t.tzinfo is none or (now() - t).total_seconds() > max_age_seconds }}
        then:
        - event: solar_mode_change_failed
          event_data:
            expected: '{{ expected_mode }}'
            actual: '{{ states(''sensor.sph_device_mode'') }}'
            attempts: '{{ repeat.index - 1 }}'
            reason: expired
        - stop: expired
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ expected_mode == 'Battery first' }}"
          sequence:
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1082, value: 0}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1092, value: 1}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1100, value: '{{ start_reg }}'}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1101, value: '{{ end_reg }}'}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1102, value: 1}
        - conditions:
          - condition: template
            value_template: "{{ expected_mode == 'Grid first' }}"
          sequence:
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1102, value: 0}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1080, value: '{{ start_reg }}'}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1081, value: '{{ end_reg }}'}
          - action: modbus.write_register
            data: {hub: sph, slave: 1, address: 1082, value: 1}
        default:
        - action: modbus.write_register
          data: {hub: sph, slave: 1, address: 1102, value: 0}
        - action: modbus.write_register
          data: {hub: sph, slave: 1, address: 1082, value: 0}
      # read back now rather than at the next poll
      - action: homeassistant.update_entity
        target:
          entity_id:
          - sensor.sph_work_mode_raw
          - sensor.sph_battery_first_slot_1_enabled_raw
          - sensor.sph_grid_first_slot_1_enabled_raw
          - sensor.sph_battery_first_slot_1_end_raw
          - sensor.sph_grid_first_slot_1_end_raw
          - sensor.sph_ac_charge_raw
      # M5-F review: a state trigger's `to:` isn't a template, so the old wait_for_trigger never matched and every
      # try sat out its full timeout; wait_template ends as soon as the mode lands
      - wait_template: >-
          {{ states('sensor.sph_device_mode') == expected_mode and states('sensor.sph_slot_mode') == expected_mode
             and (expected_mode == 'Load first'
                  or (expected_mode == 'Battery first'
                      and states('sensor.sph_battery_first_slot_1_end_raw') | int(-1) == end_reg
                      and states('sensor.sph_ac_charge_raw') | int(-1) == 1)
                  or (expected_mode == 'Grid first'
                      and states('sensor.sph_grid_first_slot_1_end_raw') | int(-1) == end_reg)) }}
        timeout:
          seconds: '{{ delay_seconds }}'
        continue_on_timeout: true
  # M5-F: after the last try, say so if the mode didn't take (packages/solar_health.yaml alerts on it)
  - if:
    - condition: template
      value_template: >-
        {{ not (states('sensor.sph_device_mode') == expected_mode and states('sensor.sph_slot_mode') == expected_mode
                and (expected_mode == 'Load first'
                     or (expected_mode == 'Battery first'
                         and states('sensor.sph_battery_first_slot_1_end_raw') | int(-1) == end_reg
                         and states('sensor.sph_ac_charge_raw') | int(-1) == 1)
                     or (expected_mode == 'Grid first'
                         and states('sensor.sph_grid_first_slot_1_end_raw') | int(-1) == end_reg))) }}
    then:
    - event: solar_mode_change_failed
      event_data:
        expected: '{{ expected_mode }}'
        actual: '{{ states(''sensor.sph_device_mode'') }} (slots {{ states(''sensor.sph_slot_mode'') }})'
        attempts: '{{ max_attempts }}'
  description: ''
ha_config_sync_tanga:
  alias: "Sync tanga config snapshot"
  icon: mdi:cloud-sync
  sequence:
    - event: ha_config_sync
      event_data:
        host: tanga
