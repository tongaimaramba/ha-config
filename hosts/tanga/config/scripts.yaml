auto_allocate_fingerprint_id:
  alias: Auto-select Next Fingerprint ID
  sequence:
  - variables:
      used_ids: "{% set store = states('input_text.fp_metadata_store') %} {% set ns
        = namespace(id_list=[]) %} {% if store %}\n  {% for record in store.split(';')
        if record %}\n    {% set parts = record.split(':') %}\n    {% if parts|length
        >= 1 %}\n      {# Extract ID from first part #}\n      {% set id_candidate
        = parts[0] | int(default=0) %}\n      {% if 1 <= id_candidate <= 127 %}\n
        \       {% if id_candidate not in ns.id_list %}\n          {% set ns.id_list
        = ns.id_list + [id_candidate] %}\n        {% endif %}\n      {% endif %}\n
        \   {% endif %}\n  {% endfor %}\n{% endif %} {{ ns.id_list | sort }}"
      next_id: "{% set id_set = used_ids | list %}  {# Convert to list #} {% for i
        in range(1, 128) %}\n  {% if i not in id_set %}\n    {{ i }}\n    {% break
        %}\n  {% elif loop.last %}\n    0\n  {% endif %}\n{% endfor %}"
  - condition: '{{ next_id | int > 0 }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.fp_enroll_id
    data:
      value: '{{ next_id }}'
  - action: notify.mobile_app_tongai_s22
    data:
      message: "\U0001F513 Fingerprint ID Selected: {{ next_id }}\n\U0001F4CA Currently
        Used IDs: {{ used_ids }}\n✅ Ready for enrollment\n"
    enabled: false
  description: ''
debug_fingerprint_id_parser:
  alias: Enhanced Debug Fingerprint ID Parser
  sequence:
  - variables:
      sensor1_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_1'') }}'
      sensor2_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_2'') }}'
      sensor3_raw: '{{ states(''sensor.fp_auth_fingerprint_metadata_part_3'') }}'
      test_parsing: '{% set test_string = "1:wwwww:Left Index" %} {% set entry = test_string.split('':'')
        %} Step1_split: {{ entry }} | Step2_first_part: ''{{ entry[0] }}'' | Step3_is_decimal:
        {{ entry[0].isdecimal() }} | Step4_as_int: {{ entry[0] | int }} | Step5_in_range:
        {{ 1 <= (entry[0] | int) <= 127 }}'
      used_ids: "{% set ns = namespace(ids=[]) %} {% for part in \n    states('sensor.fp_auth_fingerprint_metadata_part_1').split(';')
        +\n    states('sensor.fp_auth_fingerprint_metadata_part_2').split(';') +\n
        \   states('sensor.fp_auth_fingerprint_metadata_part_3').split(';') \n%}\n
        \ {% if part.strip() != '' and ':' in part %}\n    {% set entry = part.strip().split(':')
        %}\n    {% if entry|length >= 1 and entry[0].isdecimal() %}\n      {% set
        id_candidate = entry[0] | int %}\n      {% if 1 <= id_candidate <= 127 and
        id_candidate not in ns.ids %}\n        {% set ns.ids = ns.ids + [id_candidate]
        %}\n      {% endif %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {{ ns.ids
        | sort }}"
      next_id: "{% for i in range(1, 128) %}\n  {% if i not in used_ids %}\n    {{
        i }}\n    {% break %}\n  {% elif loop.last %}\n    0\n  {% endif %}\n{% endfor
        %}"
  - action: notify.mobile_app_tongai_s22
    data:
      message: "\U0001F50D ENHANCED DEBUG RESULTS:\n\n\U0001F4CA Raw Sensors:\n• Sensor
        1: '{{ sensor1_raw }}'\n• Sensor 2: '{{ sensor2_raw }}'\n• Sensor 3: '{{ sensor3_raw
        }}'\n\n\U0001F9EA Test Parsing: {{ test_parsing }}\n\n✅ Used IDs Found: {{
        used_ids }}\n\U0001F3AF Next Available ID: {{ next_id }}\n\n\U0001F4DD All
        Split Parts: {{ \n  states('sensor.fp_auth_fingerprint_metadata_part_1').split(';')
        +\n  states('sensor.fp_auth_fingerprint_metadata_part_2').split(';') +\n  states('sensor.fp_auth_fingerprint_metadata_part_3').split(';')
        \n}}\n"
manage_fp_metadata:
  alias: Manage FP Metadata
  description: "Add, update, or delete a fingerprint record in input_text.fp_metadata_store.
    \n\nUsage:\n  - service: script.manage_fp_metadata\n    data: \n      action:
    \"add\"  or \"update\" or \"delete\"\n      record: \"4:Sam:LeftThumb\"   #For
    add/update\n      record_id: \"4\"                           # For update/delete\n"
  fields:
    action:
      description: add, update, or delete
      example: add
    record:
      description: Record string in format id:name:finger (for add/update)
      example: 4:Sam:LeftThumb
    record_id:
      description: ID of record to update/delete
      example: '4'
  sequence:
  - variables:
      store: '{{ states(''input_text.fp_metadata_store'') }}'
      records: '{{ store.split('';'') if store else [] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''add'' }}'
      sequence:
      - variables:
          filtered: '{{ records | reject(''match'', ''^'' ~ record.split('':'')[0]
            ~ '':'') | list }}'
          new_records: '{{ filtered + [record] }}'
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ new_records | join('';'') }}'
        action: input_text.set_value
    - conditions:
      - condition: template
        value_template: '{{ action == ''update'' }}'
      sequence:
      - variables:
          updated: '{{ records | map(''regex_replace'', ''^'' ~ record_id ~ '':.*'',
            record) | list }}

            '
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ updated | join('';'') }}'
        action: input_text.set_value
    - conditions:
      - condition: template
        value_template: '{{ action == ''delete'' }}'
      sequence:
      - variables:
          filtered: '{{ records | reject(''match'', ''^'' ~ record_id ~ '':'') | list
            }}'
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: '{{ filtered | join('';'') }}'
        action: input_text.set_value
ignore_ac_automation_for_1_hour:
