    action: input_datetime.set_datetime
  - target:
      entity_id: input_boolean.ignore_ac_automation
    action: input_boolean.turn_on
    data: {}
  - data:
      title: AC Automation Ignored
      message: Energy-saving scenarios disabled for 1 hour
    action: persistent_notification.create
  description: ''
