        \ 'sensor.bermuda_tongai_phone_area',\n  'sensor.bermuda_tongai_phone_distance',\n
        \ 'device_tracker.bermuda_tongai_phone_bermuda_tracker'\n] %} {{ now().isoformat()
        }},\"{{ states('input_select.calibration_location') }}\" {%- for entity in
        entities %},\"{{ states(entity) }}\",\"{{ states[entity].attributes | tojson
        | replace('\"', '\"\"') }}\"{% endfor %}"
    action: notify.send_message
