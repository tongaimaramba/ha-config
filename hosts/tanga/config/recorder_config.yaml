      - sensor.briefing_reminders_ellie
      - sensor.homework_events  # Homework lists (HSE-8): the homework feeds' events as a list, rewritten every 30 min
      - sensor.homework_items  # Homework lists: what is on the children's lists, rewritten on every tick
      - sensor.kiosk_children  # G9 v2 kiosk: the girls' chores, homework and fixtures (copies of unrecorded data)
      - sensor.kiosk_forecast  # G9 v2 kiosk: tomorrow's forecast, rewritten every 30 min
