      - port: 22
        name: "Unlock Nuki"
        unique_id: "nuki_unlock_switch_port_22"
        invert_logic: true
      - port: 27
        name: "Open Nuki"
        unique_id: "nuki_open_switch_port_27"
        invert_logic: true
  - platform: momentary
    name: Empty House Trigger
    mode: on
    toggle_for: 1
    cancellable: True
