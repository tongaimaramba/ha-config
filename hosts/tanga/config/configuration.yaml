  - platform: rpi_gpio 
    switches:
      - port: 4
        name: "Nuki Power"
        unique_id: "nuki_en_switch_port_4"
        invert_logic: true
#      - port: 17
#        name: "Lock Nuki"
#        unique_id: "nuki_lock_switch_port_17"
