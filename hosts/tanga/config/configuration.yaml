# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
automation: !include automations.yaml
group: !include groups.yaml
script: !include scripts.yaml
notify: !include notify.yaml
#gpio: !include gpio.yaml
#frontend: !include frontend.yaml
#panel_custom: !include panel_custom.yaml
# Logging (10 Nov 2026): the default stays at warning (what tanga logs today). mobile_app.notify at debug records the
# push relay's reply, so a failed push says why (the 08:00 battery digest failed on 8 and 10 Nov with no reason logged).
# About 10 pushes a day, so little extra log. Drop the debug line once the cause is known.
logger:
  default: warning
  logs:
    homeassistant.components.mobile_app.notify: debug
homeassistant:
  customize: !include customize.yaml
  whitelist_external_dirs: /config/media
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config
# Dashboards as code (M1c-A/B, docs/DASHBOARDS.md): YAML dashboards generated by tools/dash, deployed by make deploy.
# Adding one here needs an HA restart; adding or changing a view is a file copy (shows on refresh). The UI dashboards
# (.storage) are untouched. A dashboard url must contain a hyphen. Manual fallback: the UI dashboards.
lovelace:
  dashboards:
    climate-home:
      mode: yaml
      filename: dashboards/climate-home.yaml
      title: Climate
      icon: mdi:home-thermometer
      show_in_sidebar: true
      require_admin: false
    house-ops:
      mode: yaml
      filename: dashboards/house-ops.yaml
      title: House ops
      icon: mdi:clipboard-pulse
      show_in_sidebar: true
      require_admin: true
    # Household dashboards (M1f): Family (parents) and Kids. Door and light buttons are stubs until wired (M1f-I).
    family-home:
      mode: yaml
      filename: dashboards/family-home.yaml
      title: Family
      icon: mdi:home-heart
      show_in_sidebar: true
      require_admin: false
    kids-home:
      mode: yaml
      filename: dashboards/kids-home.yaml
      title: Kids
      icon: mdi:home-account
      show_in_sidebar: true
      require_admin: false
    # G9 v2 (block 1, PLAN G9V2-A): one dashboard per person, generated from dashboards/specs/tanga/<name>-home/. The old
    # Family and Kids stay alongside for a week (G9-D). Each person's default dashboard is set on their phone after the
    # deploy (Tongai). Adding these needs an HA restart. Fallback: Family / Kids.
    tongai-home:
      mode: yaml
      filename: dashboards/tongai-home.yaml
      title: Tongai
      icon: mdi:account
      show_in_sidebar: true
      require_admin: false
    mojgan-home:
      mode: yaml
      filename: dashboards/mojgan-home.yaml
      title: Mojgan
      icon: mdi:account-heart
      show_in_sidebar: true
      require_admin: false
    hannah-home:
      mode: yaml
      filename: dashboards/hannah-home.yaml
      title: Hannah
      icon: mdi:account-music
      show_in_sidebar: true
      require_admin: false
    ellie-home:
      mode: yaml
      filename: dashboards/ellie-home.yaml
      title: Ellie
      icon: mdi:account-star
      show_in_sidebar: true
      require_admin: false
    # The front-door iPad's page (HSE-6): for the non-admin, local-only `kiosk` login only. Out of every sidebar (the kiosk
    # user's default dashboard is set to it); read-only apart from the downstairs lights and the hot-water boost.
    # Adding it needs an HA restart. Manual fallback: the Family and Kids dashboards on the phones.
    front-door:
      mode: yaml
      filename: dashboards/front-door.yaml
      title: Front door
      icon: mdi:tablet-dashboard
      show_in_sidebar: false
      require_admin: false
ble_monitor:
  discovery: false  # Manual device addition
  devices:
    - mac: "64:BE:10:F8:DD:27"
      name: "TongaiBLE"
      track_device: true
      tracker_scan_interval: 20
      consider_home: 180

alexa:
  smart_home:
    locale: en-GB
    endpoint: https://api.eu.amazonalexa.com/v3/events
    client_id: amzn1.application-oa2-client.aeb034512a0b425d88189e5c2edea01c
    client_secret: !secret alx_client_secret
    # HSE-11 (Tongai 2026-11-10): exactly these 13, built in packages/alexa_routines.yaml (the 3 lamp groups, the 6
    # boosts, Loft cosy, Morning lights), plus the Vivo climate start and the doorbell chime. Nothing else is exposed.
    # HSE-24 (Tongai 2026-11-15): "Warm Up Vivo" is script.car_climate_start (packages/car_climate.yaml), not Volvo's
    # button, so a start the car rejects isn't shown as on: HA is the gateway for Alexa to the house.
    filter:
      include_entities:
        - light.hannahs_lamps
        - light.ellies_lamps
        - light.loft_lamps
        - script.alexa_warm_hannah
        - script.alexa_cool_hannah
        - script.alexa_warm_ellie
        - script.alexa_cool_ellie
        - script.alexa_warm_loft
        - script.alexa_cool_loft
        - script.loft_cosy
        - script.kitchen_morning
        - script.car_climate_start
        - event.front_door_chime
    entity_config:
      script.car_climate_start:
        name: "Warm Up Vivo"
        display_categories: ACTIVITY_TRIGGER  # HA's own for a script; Alexa lists it under Scenes
