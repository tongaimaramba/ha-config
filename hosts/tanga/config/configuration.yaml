#
## Others on Arlo
#
light:
#  litra
#
  - platform: template
    lights:
      litra_beam:
        friendly_name: "Litra Beam"
        unique_id: litra_beam_light
        value_template: "{{ state_attr('sensor.litra_beam_power', 'power') | default(false) }}"
        level_template: "{{ state_attr('sensor.litra_beam_power', 'brightness') | int }}"
        temperature_template: "{{ state_attr('sensor.litra_beam_power', 'temperature') | int }}"
        turn_on:
          service: rest_command.litra_control
          data:
            endpoint: power
            value: true
        turn_off:
          service: rest_command.litra_control
          data:
            endpoint: power
            value: false
        set_level:
          service: rest_command.litra_control
          data:
            endpoint: brightness
            value: "{{ brightness }}"
        set_temperature:
          service: rest_command.litra_control
          data:
            endpoint: temperature
            value: "{{ color_temp }}"
#
## ac controller
      scenario_1_light:
        friendly_name: "Scenario 1 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_1_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_1_light
      scenario_2_light:
        friendly_name: "Scenario 2 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_2_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_2_light
      scenario_3_light:
        friendly_name: "Scenario 3 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_3_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_3_light
#
      loft_door_closed:
        friendly_name: "Loft Door Closed"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.loft_door_closed
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.loft_door_closed
            
      alexa_started_ac:
        friendly_name: "alexa_started_ac"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.alexa_started_ac
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.alexa_started_ac

