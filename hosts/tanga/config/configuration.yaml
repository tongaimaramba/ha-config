# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
automation: !include automations.yaml
group: !include groups.yaml
script: !include scripts.yaml
notify: !include notify.yaml
#gpio: !include gpio.yaml
#frontend: !include frontend.yaml
#panel_custom: !include panel_custom.yaml
homeassistant:
  customize: !include customize.yaml
  whitelist_external_dirs: /config/media
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config
ble_monitor:
  discovery: false  # Manual device addition
  devices:
    - mac: "64:BE:10:F8:DD:27"
      name: "TongaiBLE"
      track_device: true
      tracker_scan_interval: 20
      consider_home: 180

alexa:
  smart_home:
    locale: en-GB
    endpoint: https://api.eu.amazonalexa.com/v3/events
    client_id: amzn1.application-oa2-client.aeb034512a0b425d88189e5c2edea01c
    client_secret: !secret alx_client_secret
    filter:
      include_entities:
  #      - sensor.volvo_viv_battery_charge_level
        - light.coats
        - button.volvo_eva_climatization_start
        - cover.landing_blind_landing_blind
        - cover.loft_blind_loft_suite_blind
        - light.downstairs_lights
        - event.front_door_chime
        - lock.volvo_eva_lock
      include_entity_globs:
        - binary_sensor.*_contact
    #    - sensor.*_locator
      #include_domains:
      #  - switch
      #exclude_entities:
      #  - switch.outside
    entity_config:
      button.volvo_eva_climatization_start:
        name: "Warm Up Eva"
        display_categories: FAN
      cover.loft_blind_loft_suite_blind:
        name: "Bedroom Blind"
      over.landing_blind_landing_blind:
        name: "Landing Blind"
