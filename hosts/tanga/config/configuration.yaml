## RPI Rest API
#
rest_command:
  control_rpi:
    url: "http://192.168.179.63/network/"
  read_rpi:
    url: "http://192.168.179.63/"
# litra
  litra_control:
    url: "http://192.168.179.175:5000/{{ endpoint }}"
    method: POST
    content_type: "application/json"
    payload: >
      {% if endpoint == 'power' %}
        {"on": {{ value|lower }}}
      {% elif endpoint == 'brightness' %}
        {"level": {{ value|int }}}
      {% elif endpoint == 'temperature' %}
        {"level": {{ value|int }}}
      {% endif %}
