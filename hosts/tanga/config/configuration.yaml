# fp reader
#
  - platform: template
    sensors:
      enrolled_fingerprints:
        friendly_name: "Enrolled Fingerprints"
        value_template: >-
          {% set slots = range(1, 10) %}  {# Increase range as needed #}
          {% set result = [] %}
          {% for i in slots %}
            {% set name = states('input_text.fp_slot_' ~ i) %}
            {% if name %}
              {% set result = result + [i ~ ': ' ~ name] %}
            {% endif %}
          {% endfor %}
          {{ result | join(', ') }}
# FP Auth
  - platform: template
    sensors:
      fingerprint_names:
        friendly_name: "Fingerprint Names"
        value_template: >-
          {% set meta = states('input_text.fp_metadata') %}
          {% if meta == '""' or meta == '' %}
            Unknown
          {% else %}
            {{ meta }}
          {% endif %}

