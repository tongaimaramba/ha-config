# Heating buttons (ROADMAP CLM-2; CUTOVER "Heating"). The household's heating taps on the Family dashboard, all behind
# ONE gate: input_boolean.heating_buttons_enabled (starts off, hard rule 6; "Heating buttons" in Settings). With the gate
# off no HEATING service is called (nothing is sent to the Nest, tado or a timer); the script only says so, in a quiet
# notice and on the page (see "Feedback").
#   1. Nest set-point: script.heating_nest_step, Downstairs page - / +, one degree a tap, kept within 16-24 °C.
#   2. Radiator boost: script.heating_radiator_boost, Landing and Kids' bathroom pages. A gate in front of the EXISTING
#      script.heating_boost (packages/heating_boost.yaml: 25 °C for 30 min over tado's local HomeKit, tado's own timer
#      ends it, a fallback check restores it). Nothing is duplicated; that script keeps its own gate
#      (input_boolean.heating_boost_enabled, on today) and checks, and this one says which gate is off.
#   3. Hot water boost: not here. It already works on tanga (tado cloud client, AppDaemon apps/tado_cloud.yaml: a fixed
#      30 min timer, quota-aware, its own gate input_boolean.tado_cloud_enabled) and is already the "Hot water boost"
#      toggle on Family -> Home and Climate for Tongai and Mojgan.
# The Nest step reads tanga's own Nest connection only (Tongai 21 Nov, PLAN ROOM-E: tanga owns the Nest since the
# Cut-over). Until then it also compared tanga's target with pamba's mirror (sensor.downstairs_nest_pamba) and refused
# when they differed by more than 0.3 °C (on 8 Nov each box had missed changes the other saw); on 20 Nov pamba's reading
# stopped following the Nest at all (19.0 while tanga and the dial moved), so that check only blocked the buttons. Right
# after a step tanga's own reading can lag (Google's events can take a minute or more), so for 120 s (was 30 s, sized
# for pamba's mirror) the script steps from the value it last commanded (input_text.heating_nest_last_set): two taps a
# minute apart are two steps. A change at the dial inside those 120 s is overwritten by the next tap's step.
# Limits (tests/test_heating_buttons.py): the Nest target never goes outside 16-24 °C and changes by at most 1 °C a tap
# (a Nest set far outside that range, e.g. 10 °C, is left to the dial: a tap would otherwise jump it); only a Nest in
# plain heat mode (not Off, Eco, cool or the heat/cool range); at most 12 steps an hour and one every 6 s (Google
# allows few commands a minute; a tap during that pause is dropped without a message, the target on the page is the
# feedback); a boost needs a room from the list and 60 s since the last started boost.
# Feedback: every refusal, and every success, goes (a) to the phone of whoever tapped, quietly (channel Home status,
# importance low): Tongai's or Mojgan's if their HA user is recognised, otherwise Tongai's; and (b) to
# input_text.heating_buttons_last_message with its room, shown under that room's buttons only, for 5 minutes. Only a tap that arrives while another
# is still running is dropped without a message.
# Manual fallback for everything here: the Nest dial or app (Downstairs), tado's app or the radiator valve (boosts),
# the boiler's own controls. The buttons sit beside those, never in place of them.

input_boolean:
  heating_buttons_enabled:
    name: Heating buttons
    icon: mdi:radiator

input_text:
  # The last thing a heating button did or refused, with its room and the time ("landing|19:02:11 Landing boost on").
  # Only that room's page shows it, for 5 minutes (Tongai 22 Nov: the Landing showed an AC room's message). Not a
  # record: the logbook of the scripts is.
  heating_buttons_last_message:
    name: Heating buttons - last message
    max: 255
  # What the Nest step last commanded, "target|epoch seconds" ("22.3|1731524531"); used for 30 s so quick taps add up.
  heating_nest_last_set:
    name: Heating Nest step - last commanded
    max: 40

counter:
  # Nest steps taken this hour; reset on the hour (automation below). Restarting HA also resets it, which is harmless.
  heating_nest_steps:
    name: Nest steps this hour
    initial: 0
    restore: false

timer:
  # After a boost has STARTED, the same button pressed again within a minute does nothing (heating_boost lets only one
  # fallback boost run anyway). A boost that did not start does not use it up.
  heating_buttons_boost_cooldown:
    name: Boost button cooldown
    duration: "00:01:00"
    restore: false

template:
  - binary_sensor:
      # On while a boost of that room that heating_boost started is running: it records "entity|previous target" in
      # input_text.heating_boost_fallback, and the thermostat isn't read below the boost's 25 °C (tado's own 30-min
      # timer ends it before the 35-min check clears the record; an unreadable thermostat counts as still boosted).
      # `until`: "until hh:mm", the boost's end, 30 min from the start (the check timer's end less its 5 extra
      # minutes), as room_boost.yaml's sensors. Only drives the room page (the lit Boost, the status line). The entities
      # are the rooms' tado thermostats in packages/heating_boost.yaml (a test checks they agree).
      - name: Heating boost Landing
        unique_id: heating_boost_landing
        state: >-
          {% set t = state_attr('climate.tado_smart_radiator_thermostat_va2390168576', 'temperature') %}
          {{ states('input_text.heating_boost_fallback').startswith('climate.tado_smart_radiator_thermostat_va2390168576|') and not (t is number and t < 25) }}
        attributes:
          until: >-
            {% set f = state_attr('timer.heating_boost_fallback', 'finishes_at') %}
            {{ 'until ' ~ (as_timestamp(f) - 300) | timestamp_custom('%H:%M')
               if f and is_state('timer.heating_boost_fallback', 'active') else '' }}
      - name: Heating boost Kids bathroom
        unique_id: heating_boost_kids_bathroom
        state: >-
          {% set t = state_attr('climate.tado_smart_radiator_thermostat_va0796464128', 'temperature') %}
          {{ states('input_text.heating_boost_fallback').startswith('climate.tado_smart_radiator_thermostat_va0796464128|') and not (t is number and t < 25) }}
        attributes:
          until: >-
            {% set f = state_attr('timer.heating_boost_fallback', 'finishes_at') %}
            {{ 'until ' ~ (as_timestamp(f) - 300) | timestamp_custom('%H:%M')
               if f and is_state('timer.heating_boost_fallback', 'active') else '' }}

script:
  # Say what a heating button did or refused: the page's helper text and a quiet notice to `who` (a notify service: the
  # presser's, else Tongai's). `phone: false` for outcomes that heating_boost has already sent to Tongai. Manual
  # fallback: none needed (it only reports).
  heating_buttons_say:
    alias: Heating buttons - say what happened
    icon: mdi:message-text
    mode: queued
    max: 5
    fields:
      title:
        description: Short headline for the notice
      message:
        description: What happened and what to do instead
      who:
        description: notify.mobile_app_tongaism25 or notify.mobile_app_iphone_32 (anything else means Tongai's)
      phone:
        description: false to skip the notice (the page text is still set)
      room:
        description: >-
          The room page the message belongs to (a comfort room key: landing, kids_bathroom, downstairs, loft_suite,
          ellie, hannah, study; the AC boost's `loft` counts as loft_suite). Only that room's page shows it.
    variables:
      page_room: >-
        {%- set r = room if room is defined and room else '' -%}{{ 'loft_suite' if r == 'loft' else r }}
      service: >-
        {{ who if who is defined and who in ['notify.mobile_app_tongaism25', 'notify.mobile_app_iphone_32']
           else 'notify.mobile_app_tongaism25' }}
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_buttons_last_message
        data:
          value: "{{ ((page_room ~ '|' ~ now().strftime('%H:%M:%S') ~ ' ' ~ message) | string)[:250] }}"
      - condition: template
        value_template: "{{ phone is not defined or phone }}"
      - action: "{{ service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: heating_buttons
            channel: Home status
            importance: low

  # Warm or cool Downstairs by one degree (field step: 1 or -1). Used by - / + on the Downstairs page. Sets the Nest's
  # target only: never its mode, Eco or away. Says why it did nothing (heating_buttons_say). Manual fallback: the Nest
  # dial or app. The only place in this repo that commands the Nest thermostat (lint-refs' command guard allows exactly
  # this script and climate.downstairs_2).
  heating_nest_step:
    alias: Heating - Nest one degree
    icon: mdi:thermometer-plus
    mode: single  # a tap while the last one is still in its 6 s pause is dropped, so taps can't pile up
    max_exceeded: silent
    fields:
      step:
        description: 1 warmer, -1 cooler (anything else is refused)
        example: 1
    variables:
      nest: climate.downstairs_2     # tanga's own Nest connection; keep in step with tools/hosts.json command_guard
      min_c: 16
      max_c: 24
      max_steps_hour: 12
      settle_s: 120  # tanga's own reading can take a minute or more to follow a command (Google's events)
      delta: "{{ step | int(0) if step is defined else 0 }}"
      # Whose phone gets the notice: the HA user who tapped (ids as in dashboards/data/tanga.yaml), else Tongai's (also if
      # a script run does not expose `context`: unverified on the box, then everything goes to Tongai's phone).
      who: >-
        {{ {'654b5cdf36f8494cb948a9d13e1c17c7': 'notify.mobile_app_tongaism25',
            '06495997aca44e59a54f1b3138ad088e': 'notify.mobile_app_iphone_32'}
           .get(context.user_id if context is defined and context else none, 'notify.mobile_app_tongaism25') }}
    sequence:
      # 1. The gate first, before anything about the Nest is read: off = say so and stop, no heating service called.
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.heating_buttons_enabled', 'on') }}"
        then:
          - action: script.heating_buttons_say
            data:
              title: Heating buttons are switched off
              message: Turn on "Heating buttons" to use it · or use the Nest dial or app
              who: "{{ who }}"
              room: downstairs
          - stop: Heating buttons are switched off
      - if:
          - condition: template
            value_template: "{{ delta not in [1, -1] }}"
        then:
          - action: script.heating_buttons_say
            data:
              title: Downstairs not changed
              message: The button sent a step that is not +1 or -1 · use the Nest dial or app
              who: "{{ who }}"
              room: downstairs
          - stop: Bad step
      # 2. Read the Nest, defensively: anything that is not a number is "none", never an error.
      - variables:
          hvac: "{{ states(nest) }}"
          preset: "{{ state_attr(nest, 'preset_mode') }}"
          nest_t: "{{ state_attr(nest, 'temperature') | float(none) }}"
          last_value: >-
            {{ (states('input_text.heating_nest_last_set') | string).split('|')[0] | float(none)
               if '|' in (states('input_text.heating_nest_last_set') | string) else none }}
          last_age: >-
            {{ now().timestamp() - ((states('input_text.heating_nest_last_set') | string).split('|')[1] | float(0))
               if '|' in (states('input_text.heating_nest_last_set') | string) else 99999 }}
          recent: "{{ last_value is number and 0 <= last_age < settle_s }}"
          current: "{{ last_value if recent else nest_t }}"
      - variables:
          wanted: >-
            {{ ([min_c, [max_c, current + delta] | min] | max) | round(1) if current is number else none }}
          why_not: >-
            {%- if hvac in ['unavailable', 'unknown'] -%}unreachable
            {%- elif hvac == 'off' -%}nest_off
            {%- elif hvac == 'heat_cool' -%}range
            {%- elif hvac == 'cool' -%}cool
            {%- elif hvac != 'heat' -%}mode
            {%- elif preset == 'eco' -%}eco
            {%- elif current is not number -%}reading
            {%- elif (delta > 0 and current >= max_c) or (delta < 0 and current <= min_c)
                      or (wanted - current) | abs > 1.05 -%}limit
            {%- elif states('counter.heating_nest_steps') | int(0) >= max_steps_hour -%}rate
            {%- else -%}ok{%- endif -%}
          message: >-
            {%- if why_not == 'unreachable' -%}The Nest can't be reached · use the Nest dial or app
            {%- elif why_not == 'nest_off' -%}The Nest is switched off · turn it on at the Nest dial or app
            {%- elif why_not == 'range' -%}The Nest is in heat/cool range mode, which has two targets · set them on the Nest dial or app
            {%- elif why_not == 'cool' -%}The Nest is in cool mode · change it on the Nest dial or app
            {%- elif why_not == 'mode' -%}The Nest is in a mode these buttons don't handle ({{ hvac }}) · use the Nest dial or app
            {%- elif why_not == 'eco' -%}The Nest is in Eco · change it on the Nest dial or app
            {%- elif why_not == 'reading' -%}Can't read the Nest's target · use the Nest dial or app
            {%- elif why_not == 'limit' -%}Already {{ current }}°, the buttons stay within {{ min_c }}-{{ max_c }}° · use the Nest dial or app beyond that
            {%- elif why_not == 'rate' -%}{{ max_steps_hour }} steps already this hour · use the Nest dial or app
            {%- endif -%}
      - if:
          - condition: template
            value_template: "{{ why_not != 'ok' }}"
        then:
          - action: script.heating_buttons_say
            data:
              title: Downstairs not changed
              message: "{{ message }}"
              who: "{{ who }}"
              room: downstairs
          - stop: "{{ why_not }}"
      # 3. Step. Counted before the call, so a failing call still uses up its step.
      - action: counter.increment
        target:
          entity_id: counter.heating_nest_steps
      - action: climate.set_temperature
        target:
          entity_id: climate.downstairs_2
        data:
          temperature: "{{ wanted }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_nest_last_set
        data:
          value: "{{ wanted }}|{{ now().timestamp() | int }}"
      - action: script.heating_buttons_say
        data:
          title: "Downstairs {{ wanted }}°"
          message: "Was {{ current }}° · the Nest dial or app changes it back"
          who: "{{ who }}"
          room: downstairs
      - delay: "00:00:06"  # the rate limit: at most 10 commands a minute

  # Boost a radiator room that has no AC (Landing, Kids' bathroom) for 30 min: the gate and the room list in front of
  # script.heating_boost, which does the boost (25 °C, tado ends it; see packages/heating_boost.yaml). The rooms with
  # an AC are the room controller's (CLM-1). Says which switch is off ("Heating buttons" or "Heating boost") and why a
  # boost did not start; the 60 s cooldown starts only once a boost HAS started.
  # Pressed again while that room's boost runs (Tongai 22 Nov, as the AC rooms' buttons): ends it now through
  # script.heating_boost_end (the previous target back), ungated, as ending a boost always is. It says instead, and
  # leaves the 35-min check to end it, when: it started under a minute ago (a double tap must not start and end it at
  # once), the thermostat can't be read, the previous target is unknown, or the check is already acting. A boost tado
  # has already ended (its record waiting for the 35-min check) is cleared once the gates pass, so the press starts a
  # new one. Every message is the room's own (`room` for heating_buttons_say). Manual fallback: the tado app
  # (boost/override per room) or the valve.
  heating_radiator_boost:
    alias: Heating - radiator boost
    icon: mdi:radiator
    mode: single
    max_exceeded: silent
    fields:
      room:
        description: Landing or Kids' bathroom
        example: Landing
    variables:
      allowed: ["Landing", "Kids' bathroom"]
      # Each room's tado thermostat, as in heating_boost's room list (a test checks they agree), and its page.
      thermostats:
        Landing: climate.tado_smart_radiator_thermostat_va2390168576
        "Kids' bathroom": climate.tado_smart_radiator_thermostat_va0796464128
      pages: {"Landing": "landing", "Kids' bathroom": "kids_bathroom"}
      page: "{{ pages.get(room, '') if room is defined and room else '' }}"
      who: >-
        {{ {'654b5cdf36f8494cb948a9d13e1c17c7': 'notify.mobile_app_tongaism25',
            '06495997aca44e59a54f1b3138ad088e': 'notify.mobile_app_iphone_32'}
           .get(context.user_id if context is defined and context else none, 'notify.mobile_app_tongaism25') }}
      # This room's boost is on record (heating_boost's "entity|previous target"); `boosted`: the thermostat still at
      # 25 °C, or unreadable (as the lit sensor: a boost is never taken as over on a failed read).
      record: "{{ states('input_text.heating_boost_fallback') }}"
      own: "{{ room is defined and room in allowed and record.startswith(thermostats[room] ~ '|') }}"
      readable: >-
        {{ own and states(thermostats[room]) not in ['unavailable', 'unknown']
           and state_attr(thermostats[room], 'temperature') | is_number }}
      boosted: "{{ own and (not readable or state_attr(thermostats[room], 'temperature') | float(0) >= 25) }}"
      previous: "{{ record.split('|')[1] if own else '' }}"
      checking: "{{ is_state('timer.heating_boost_fallback', 'active') }}"
    sequence:
      # Pressed again while it runs: end it (ungated), or say why the 35-min check will.
      - if:
          - condition: template
            value_template: "{{ boosted }}"
        then:
          - variables:
              hold: >-
                {%- if not is_state('timer.heating_buttons_boost_cooldown', 'idle') -%}wait
                {%- elif not readable -%}unreadable
                {%- elif not checking -%}checking
                {%- elif not previous | is_number -%}unknown
                {%- else -%}{%- endif -%}
          - if:
              - condition: template
                value_template: "{{ hold != '' }}"
            then:
              - action: script.heating_buttons_say
                data:
                  title: >-
                    {{ {'wait': room ~ ' boost just started', 'unreadable': room ~ ' cannot be read now',
                        'checking': room ~ ' boost is ending', 'unknown': room ~ ' boost: no earlier temperature'}[hold] }}
                  message: >-
                    {{ {'wait': 'Tap again after a minute to end it',
                        'unreadable': 'Its boost still ends by itself · or use the tado app',
                        'checking': 'It ends by itself in a moment',
                        'unknown': 'Set its temperature in the tado app'}[hold] }}
                  who: "{{ who }}"
                  phone: false
                  room: "{{ page }}"
              - stop: "{{ hold }}"
          - action: script.heating_boost_end
          - action: script.heating_buttons_say
            data:
              title: "{{ room }} boost ended"
              message: "Back to {{ '%g' | format(previous | float) }}° · resume schedule in tado app"
              who: "{{ who }}"
              phone: false
              room: "{{ page }}"
          - stop: Ended by the button
      - variables:
          why_not: >-
            {%- if not is_state('input_boolean.heating_buttons_enabled', 'on') -%}gate
            {%- elif room is not defined or room not in allowed -%}room
            {%- elif not is_state('timer.heating_buttons_boost_cooldown', 'idle') -%}wait
            {%- elif not is_state('input_boolean.heating_boost_enabled', 'on') -%}boost_gate
            {%- else -%}ok{%- endif -%}
      # tado already ended this room's boost (the record waits for the 35-min check): clear it so this press can start a
      # new one. Only once the gates pass: a refused press changes nothing.
      - if:
          - condition: template
            value_template: "{{ why_not == 'ok' and own and checking }}"
        then:
          - action: script.heating_boost_end
      - variables:
          why_not: >-
            {{ 'running' if why_not == 'ok' and states('input_text.heating_boost_fallback')
               not in ['', 'unknown', 'unavailable'] else why_not }}
          title: >-
            {{ {'gate': 'Heating buttons are switched off', 'boost_gate': 'Boost is switched off (heating_boost_enabled)',
                'room': 'Boost not started', 'wait': 'Boost not started', 'running': 'Boost not started'}
               .get(why_not, '') }}
          message: >-
            {{ {'gate': 'Turn on "Heating buttons" to use it · or use the tado app',
                'boost_gate': 'Turn on "Heating boost" (heating_boost_enabled) · or use the tado app',
                'room': 'No boost button for that room · use the tado app',
                'wait': 'A boost was started a moment ago · give it a minute, or use the tado app',
                'running': 'Another boost is already running · use the tado app'}
               .get(why_not, '') }}
      - if:
          - condition: template
            value_template: "{{ why_not != 'ok' }}"
        then:
          - action: script.heating_buttons_say
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              who: "{{ who }}"
              room: "{{ page }}"
          - stop: "{{ why_not }}"
      - action: script.heating_boost
        data:
          room: "{{ room }}"
      # heating_boost has no result to read; on the local route it records the boost in heating_boost_fallback, so
      # that being set is "started" (tests check every listed room is on the local route). heating_boost has already
      # told Tongai how it went, so only another presser gets a notice; everyone gets the page text.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.heating_boost_fallback') not in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.heating_buttons_boost_cooldown
              - action: script.heating_buttons_say
                data:
                  title: "{{ room }} boost on"
                  message: 25° for 30 min, then back to the schedule · tap again to stop
                  who: "{{ who }}"
                  phone: "{{ who != 'notify.mobile_app_tongaism25' }}"
                  room: "{{ page }}"
        default:
          - action: script.heating_buttons_say
            data:
              title: "{{ room }} boost did not start"
              message: The thermostat could not be reached · use the tado app
              who: "{{ who }}"
              phone: "{{ who != 'notify.mobile_app_tongaism25' }}"
              room: "{{ page }}"

automation:
  # Reset the hourly Nest step count on the hour (and at start-up). It only zeroes a counter: no heating action, so
  # deliberately not behind the gate. Manual fallback: none needed.
  - id: heating_buttons_reset_nest_steps
    alias: Heating buttons - reset the hourly Nest count
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 0
      - trigger: homeassistant
        event: start
    actions:
      - action: counter.reset
        target:
          entity_id: counter.heating_nest_steps
