# Homework to-do lists (HSE-8 follow-up, Tongai 10 Nov). The school's homework feeds (calendar.hannah_homework,
# calendar.ellie_homework: one event per piece of homework, on its due date) are copied into a to-do list per child
# (todo.hannah_homework, todo.ellie_homework: Local To-do lists made in the UI) by the AppDaemon app apps/homework.yaml.
# The children tick items off on Kids -> Homework; on Friday evenings the same page shows what is still to do, soonest
# due first. This package holds the gate and the two reads the app needs (it can't call a service that returns data).
# Owner: tanga.
#
# GATE input_boolean.homework_enabled (starts off, hard rule 6). Off: nothing is copied; the lists and the page work
# as plain to-do lists. The app only ever adds items (never edits or deletes one).
# Manual fallback: the school's homework app or site, and the calendar app.
input_boolean:
  homework_enabled:
    name: Homework to-do lists
    icon: mdi:book-check-outline

# The Add homework form on each girl's Homework tab (Tongai 21 Nov: "it needs to have a what and a when at the moment of
# adding the item. The 2 step process is too much friction"). What? and When? (a date, back to tomorrow after each Add
# and every night), then Add: script.homework_add writes the one item to her own list with its due date and says what
# it did under the form. HA's own add box on her list is hidden, so there is one way to add. One form per girl, so two
# people adding at once on different girls' pages don't clash. Not gated: it does what HA's own add box did (an item
# on her own list, by hand); the nightly date reset is behind homework_enabled. Manual fallback: HA's to-do panel.
input_text:
  homework_new_hannah:
    name: What?
    icon: mdi:book-edit-outline
    max: 100
  homework_new_ellie:
    name: What?
    icon: mdi:book-edit-outline
    max: 100
  homework_form_hannah:  # the form's answer ("Added: ...", or what to fix)
    name: Homework form
    max: 255
  homework_form_ellie:
    name: Homework form
    max: 255

input_datetime:
  homework_due_hannah:
    name: When?
    icon: mdi:calendar
    has_date: true
    has_time: false
  homework_due_ellie:
    name: When?
    icon: mdi:calendar
    has_date: true
    has_time: false

script:
  # The Add button on the form. Purpose: add one piece of homework, with its due date, to that girl's list. Refuses
  # (and says why) with no What? or a date before today; nothing else is ever touched. Manual fallback: HA's to-do
  # panel, her list, Add item, then tap it for the date.
  homework_add:
    alias: Homework - add from the form
    icon: mdi:book-plus-outline
    mode: single  # a double tap adds once
    max_exceeded: silent
    fields:
      child:
        description: hannah or ellie
        required: true
        selector: {select: {options: [hannah, ellie]}}
    sequence:
      - variables:
          who: "{{ child if child in ['hannah', 'ellie'] else '' }}"
      - condition: template
        value_template: "{{ who != '' }}"
      - variables:
          what: "{{ states('input_text.homework_new_' ~ who) | trim }}"
          due: "{{ states('input_datetime.homework_due_' ~ who) }}"
          answer: "input_text.homework_form_{{ who }}"
      - if:
          - condition: template
            value_template: "{{ what in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: input_text.set_value
            target: {entity_id: "{{ answer }}"}
            data: {value: "Type what the homework is first."}
          - stop: no What?
      - if:
          - condition: template
            value_template: "{{ not (due is match('[0-9]{4}-[0-9]{2}-[0-9]{2}$')) or due < now().date() | string }}"
        then:
          - action: input_text.set_value
            target: {entity_id: "{{ answer }}"}
            data: {value: "Pick when it's due: today or later."}
          - stop: no date
      - action: todo.add_item
        target: {entity_id: "todo.{{ who }}_homework"}
        data:
          item: "{{ what }}"
          due_date: "{{ due }}"
      - action: input_text.set_value
        target: {entity_id: "input_text.homework_new_{{ who }}"}
        data: {value: ""}
      - action: input_datetime.set_datetime
        target: {entity_id: "input_datetime.homework_due_{{ who }}"}
        data: {date: "{{ (now() + timedelta(days=1)).date() | string }}"}
      - action: input_text.set_value
        target: {entity_id: "{{ answer }}"}
        data:
          value: "{{ ('Added: ' ~ what ~ ', due ' ~ strptime(due, '%Y-%m-%d').strftime('%a %-d %b'))[:255] }}"

automation:
  # The form's When? goes back to tomorrow every night and at a restart, so it never offers a day already gone.
  # Purpose: the default is always tomorrow, and What? is blank, not "unknown". Manual fallback: pick the date by hand.
  - id: homework_form_due_tomorrow
    alias: Homework - form date back to tomorrow
    triggers:
      - trigger: time
        at: "00:01:00"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.homework_enabled
        state: "on"
    actions:
      - action: input_datetime.set_datetime
        target: {entity_id: [input_datetime.homework_due_hannah, input_datetime.homework_due_ellie]}
        data: {date: "{{ (now() + timedelta(days=1)).date() | string }}"}
      - action: input_text.set_value
        target: {entity_id: [input_text.homework_form_hannah, input_text.homework_form_ellie]}
        data: {value: ""}
      # What? reads "unknown" until it is first set (Tongai's phone 21 Nov): a field never set is blanked; one being
      # typed into is left alone
      - variables:
          never_set: >-
            {{ ['input_text.homework_new_hannah', 'input_text.homework_new_ellie']
               | select('is_state', ['unknown', 'unavailable']) | list }}
      - if: "{{ never_set | count > 0 }}"
        then:
          - action: input_text.set_value
            target: {entity_id: "{{ never_set }}"}
            data: {value: ""}

template:
  # The homework feeds, read for the app: every 30 min, at start and on a `homework_refresh` event, today 00:00 + 42
  # days (the school sets homework a week or two ahead; how far ahead the feed publishes is unverified). Title, due
  # (the event's start), and the description's lines without the indent, at most 600 characters (the subject, class,
  # homework title, set by / set on / due on, one a line). State 'ok' or 'unavailable' (the read failed: the app then adds nothing). Excluded from
  # the recorder (recorder_config.yaml). Manual fallback: the calendar app.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/30"
      - trigger: event
        event_type: homework_refresh
    actions:
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id:
            - calendar.hannah_homework
            - calendar.ellie_homework
        data:
          start_date_time: "{{ today_at().isoformat() }}"
          duration:
            days: 42
        response_variable: cal
    sensor:
      - name: Homework events
        unique_id: homework_events
        icon: mdi:calendar-check
        state: "{{ 'ok' if cal is defined and cal is mapping else 'unavailable' }}"
        attributes:
          fetched: "{{ now().isoformat() }}"
          events: >-
            {%- set ns = namespace(l=[]) -%}
            {%- if cal is defined and cal is mapping -%}
            {%- for c, r in cal.items() -%}
            {%- for e in (r.events if r is mapping and r.events is defined else []) -%}
            {%- set ns.l = ns.l + [{'c': c, 's': ((e.summary or '') | string)[:90], 'b': e.start | string,
                'd': (((e.description or '') | string).splitlines() | map('trim') | reject('eq', '')
                      | join('\n'))[:600]}] -%}
            {%- endfor -%}
            {%- endfor -%}
            {%- endif -%}
            {{ ns.l }}

  # What is already on the two lists (open and ticked), so the app never adds a piece of homework twice even if its
  # own record is lost. Read at start, every 30 min, whenever a list changes (its state is the open count) and on a
  # `homework_refresh` event. Only items due today or later, or with no due date (the app never adds past-due homework,
  # so older ones can't matter; the attribute stays small as the lists grow over a year). Undated items are the ones
  # added by hand: the kiosk lists them too (packages/kiosk_board.yaml reads this sensor; Tongai 21 Nov: an item added
  # to Ellie's list didn't show on the weekend view). State 'ok' or 'unavailable' (a list
  # doesn't exist yet: the app then adds nothing).
  # Excluded from the recorder. Manual fallback: none needed (the lists themselves are the record).
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/30"
      - trigger: state
        entity_id:
          - todo.hannah_homework
          - todo.ellie_homework
      - trigger: event
        event_type: homework_refresh
    actions:
      - action: todo.get_items
        continue_on_error: true
        target:
          entity_id:
            - todo.hannah_homework
            - todo.ellie_homework
        data:
          status: [needs_action, completed]
        response_variable: lists
    sensor:
      - name: Homework items
        unique_id: homework_items
        icon: mdi:format-list-checks
        state: >-
          {{ 'ok' if lists is defined and lists is mapping and 'todo.hannah_homework' in lists
             and 'todo.ellie_homework' in lists else 'unavailable' }}
        attributes:
          fetched: "{{ now().isoformat() }}"
          items: >-
            {%- set ns = namespace(l=[]) -%}
            {%- if lists is defined and lists is mapping -%}
            {%- for t, r in lists.items() -%}
            {%- for i in (r['items'] if r is mapping and r['items'] is defined else []) -%}
            {%- set due = ((i.due or '') | string)[:10] -%}
            {%- if due == '' or due >= today_at().date() | string -%}
            {%- set ns.l = ns.l + [{'t': t, 's': ((i.summary or '') | string)[:255], 'd': due,
                'st': (i.status or '') | string}] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endfor -%}
            {%- endif -%}
            {{ ns.l }}
