# Generated by tools/presence from dashboards/data/tanga-presence.yaml.
# Edit that list, then run `tools/presence render`.
#
# Presence (HSE-5; Tongai 9 Nov 2026): who is home, from every tracker listed for each person. A person is HOME if ANY
# of their trackers says home and away only if ALL say away; a tracker that is unknown, unavailable or missing has no
# opinion. `person.*` (UI-managed) is not touched: these are separate entities, passive (they send nothing). One
# trigger-based template block per person (the trackers changing, every 5 minutes, and HA start) works the answer out
# once and its three entities read it.
#   binary_sensor.presence_<person>        on = home. Attributes: place (Home, a zone name, Away, Unknown), since,
#                                          last_seen, signal (which roles agree), home_by (which trackers say home)
#   sensor.presence_<person>_where         the place as text, with `detail` ("since 08:41 · 53%")
#   binary_sensor.presence_<person>_stale  on when no tracker has reported for 240 min
# Consumers to repoint later, each its own yes (listed in docs/reports/2026-11-09-named-places.md): the call check,
# the mode detector, the alarm shadow, the auto-unlock shadow, the family "Who's home" tiles. Only Family -> Map uses
# them now.
#
# ARRIVAL ALERTS (M-E): one automation per person below, gated by input_boolean.arrival_alerts_enabled
# (starts off, hard rule 6). It pushes to Tongai's phone only, on the quiet "Home status" channel, after a 2 minute
# debounce, never 22:00-06:30: when a person with `home: true` arrives home, and when one arrives at or leaves a
# listed place (School). Mojgan's and the kids' own phones get nothing. All pushes go through
# script.presence_alert_send, the one place to repoint at the notification router (script.notification_route, HSE-7
# PR #288) once that is deployed; this package does not need it.
# Manual fallback: turn the gate off; the Family -> Map tab still shows everything.
#
# What the times mean: `since` is when the deciding tracker last changed (a restart of HA resets it to the restart),
# and `last_seen` is the most recent report from any tracker. A phone resting at home may report rarely, so an
# overnight "last heard 6 h ago" is normal, not a fault.

input_boolean:
  arrival_alerts_enabled:
    name: Arrival alerts
    icon: mdi:map-marker-radius

template:
  - triggers:
      - trigger: state
        entity_id:
          - device_tracker.tongaism25
          - device_tracker.bermuda_tongai_phone_bermuda_tracker
          - device_tracker.tongai_samsung25
      - trigger: time_pattern
        minutes: "/5"  # staleness and "last heard" move with the clock; hours matter, not minutes
      - trigger: homeassistant
        event: start
    variables:
      calc: >-
        {%- set ns = namespace(home=[], away=[], seen=[], place='', place_at=none,
                               home_roles=[], away_roles=[], home_ids=[]) -%}
        {%- macro take(o, eid, role) -%}
          {%- if o is not none and o.state not in ['unknown', 'unavailable'] -%}
            {%- set ns.seen = ns.seen + [o.last_reported or o.last_updated] -%}
            {%- if o.state == 'home' -%}
              {%- set ns.home = ns.home + [o.last_changed] -%}
              {%- set ns.home_roles = ns.home_roles + [role] -%}
              {%- set ns.home_ids = ns.home_ids + [eid] -%}
            {%- else -%}
              {%- set ns.away = ns.away + [o.last_changed] -%}
              {%- set ns.away_roles = ns.away_roles + [role] -%}
              {%- if o.state != 'not_home' and not ns.place -%}
                {%- set ns.place = o.state -%}{%- set ns.place_at = o.last_changed -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endmacro -%}
        {%- set _ = take(states.device_tracker.tongaism25, 'device_tracker.tongaism25', 'gps') -%}
        {%- set _ = take(states.device_tracker.bermuda_tongai_phone_bermuda_tracker, 'device_tracker.bermuda_tongai_phone_bermuda_tracker', 'ble') -%}
        {%- set _ = take(states.device_tracker.tongai_samsung25, 'device_tracker.tongai_samsung25', 'ble') -%}
        {%- set seen = (ns.seen | max) if ns.seen else none -%}
        {%- set age = (((now() - seen).total_seconds() / 60) | int) if seen else 0 -%}
        {%- set stale = seen is not none and age > 240 -%}
        {%- set at = (ns.home | min) if ns.home else (ns.place_at if ns.place else ((ns.away | max) if ns.away else none)) -%}
        {%- set detail -%}{% if at is none %}Not reporting{% elif stale %}last heard {% if age < 60 %}{{ age }} min{% elif age < 1440 %}{{ (age / 60) | int }} h{% else %}{{ (age / 1440) | int }} d{% endif %} ago{% else %}since {% set l = as_local(at) %}{% if l.date() == now().date() %}{{ l.strftime('%H:%M') }}{% else %}{{ l.strftime('%a %H:%M') }}{% endif %}{% endif %}{% set bo = states.sensor.tongaism25_battery_level %}{% if bo is not none and states('sensor.tongaism25_battery_level') | int(-1) >= 0 and (now() - (bo.last_reported or bo.last_updated)).total_seconds() < 129600 %} · {{ states('sensor.tongaism25_battery_level') | int }}%{% endif %}{%- endset -%}
        {{ {
          'home': ns.home | length > 0,
          'known': ns.seen | length > 0,
          'place': 'Home' if ns.home else (ns.place if ns.place else ('Away' if ns.away else 'Unknown')),
          'since': at.isoformat() if at else '',
          'last_seen': seen.isoformat() if seen else '',
          'signal': (ns.home_roles | unique | join(' + ')) if ns.home
                    else ((ns.away_roles | unique | join(' + ')) if ns.away else 'none'),
          'home_by': ns.home_ids,
          'stale': stale,
          'detail': detail | trim,
        } }}
    binary_sensor:
      - name: Presence Tongai
        unique_id: presence_tongai
        device_class: presence
        icon: mdi:account-check
        state: "{{ calc.home }}"
        availability: "{{ calc.known }}"
        attributes:
          place: "{{ calc.place }}"
          since: "{{ calc.since }}"
          last_seen: "{{ calc.last_seen }}"
          signal: "{{ calc.signal }}"
          home_by: "{{ calc.home_by }}"
      - name: Presence Tongai stale
        unique_id: presence_tongai_stale
