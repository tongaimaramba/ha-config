      - condition: state
        entity_id: input_boolean.arrival_alerts_enabled
        state: "on"
      - condition: time
        after: "06:30:00"
        before: "22:00:00"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'Unknown']
             and trigger.to_state.state not in ['unknown', 'unavailable', 'Unknown'] }}
    actions:
      - variables:
          text: >-
            {% set n = trigger.to_state.state %}{% set o = trigger.from_state.state %}
            {% if n == 'Home' and home_alert %}{{ who }} is home
            {% elif n in places %}{{ who }} arrived at {{ n }}
            {% elif o in places and n != o %}{{ who }} left {{ o }}{% endif %}
      - condition: template
        value_template: "{{ text | trim | length > 0 }}"
      - action: script.presence_alert_send
        data:
          tag: presence_ellie
          message: "{{ text | trim }}"
