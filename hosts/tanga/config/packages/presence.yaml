script:
  # The one way a presence alert is sent (quiet "Home status" push to Tongai). To use the notification router
  # instead (HSE-7), replace the action with script.notification_route and add the id to the router's list.
  # Manual fallback: none needed (the alerts are gated off; the tab shows the same facts).
  presence_alert_send:
    alias: Presence alert - send
    icon: mdi:bell-badge-outline
    mode: queued
    max: 10
    fields:
      tag:
        description: Replaces the person's earlier alert
      message:
        description: The alert text
    sequence:
      - action: notify.mobile_app_tongaism25
        data:
          title: Family
          message: "{{ message }}"
          data:
            tag: "{{ tag }}"
            channel: Home status
            importance: low

automation:
  # Arrival alert for Mojgan: arriving home.
  # For: a parent knowing someone got home or to school. Manual fallback: the Family -> Map tab, or the gate off.
  - id: presence_alert_mojgan
    alias: Presence alert - Mojgan
    mode: queued
    max: 5
    variables:
      who: Mojgan
      home_alert: true
      places: []
    triggers:
      - trigger: state
        entity_id: sensor.presence_mojgan_where
        to: ~  # the place itself changed; not the detail or since attributes
        for: {minutes: 2}  # a GPS blip or a Bluetooth flicker settles before anyone is told
    conditions:
      - condition: state
        entity_id: input_boolean.arrival_alerts_enabled
        state: "on"
      - condition: time
        after: "06:30:00"
        before: "22:00:00"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'Unknown']
             and trigger.to_state.state not in ['unknown', 'unavailable', 'Unknown'] }}
    actions:
      - variables:
          text: >-
            {% set n = trigger.to_state.state %}{% set o = trigger.from_state.state %}
            {% if n == 'Home' and home_alert %}{{ who }} is home
            {% elif n in places %}{{ who }} arrived at {{ n }}
            {% elif o in places and n != o %}{{ who }} left {{ o }}{% endif %}
      - condition: template
        value_template: "{{ text | trim | length > 0 }}"
      - action: script.presence_alert_send
        data:
          tag: presence_mojgan
          message: "{{ text | trim }}"
  # Arrival alert for Hannah: arriving home, arriving at and leaving School.
  # For: a parent knowing someone got home or to school. Manual fallback: the Family -> Map tab, or the gate off.
  - id: presence_alert_hannah
    alias: Presence alert - Hannah
    mode: queued
    max: 5
    variables:
      who: Hannah
      home_alert: true
      places: ["School"]
    triggers:
      - trigger: state
        entity_id: sensor.presence_hannah_where
        to: ~  # the place itself changed; not the detail or since attributes
        for: {minutes: 2}  # a GPS blip or a Bluetooth flicker settles before anyone is told
    conditions:
      - condition: state
        entity_id: input_boolean.arrival_alerts_enabled
        state: "on"
      - condition: time
        after: "06:30:00"
        before: "22:00:00"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'Unknown']
             and trigger.to_state.state not in ['unknown', 'unavailable', 'Unknown'] }}
    actions:
      - variables:
          text: >-
            {% set n = trigger.to_state.state %}{% set o = trigger.from_state.state %}
            {% if n == 'Home' and home_alert %}{{ who }} is home
            {% elif n in places %}{{ who }} arrived at {{ n }}
            {% elif o in places and n != o %}{{ who }} left {{ o }}{% endif %}
      - condition: template
        value_template: "{{ text | trim | length > 0 }}"
      - action: script.presence_alert_send
        data:
          tag: presence_hannah
          message: "{{ text | trim }}"
