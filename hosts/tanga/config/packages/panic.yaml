# Call buttons (M2 step 1; decisions M2-H, M2-I). Each bedroom has a button (ESPHome, esphome/<x>-panic.yaml; the ids
# keep their first name, "panic", so nothing else has to change). Held 2 s, its sensor turns on and tanga:
#   - sends both parents an urgent alert, naming the room, with an "I'm coming" action
#     (Tongai's Android: the alarm stream, through Do Not Disturb; Mojgan's iPhone: an iOS critical alert);
#   - turns the downstairs lamps on (Hue);
#   - calls the button's `panic_ack` (its LED goes green) right after Tongai's alert is handed to the push service:
#     green means "handed over", not "heard" (a relay failure or quota is only logged), so the monthly check is the
#     real test. "I'm coming" calls `panic_seen` (blue, 10 min); "All sorted" calls `panic_clear` (LED off).
#   Phones: Tongai's Samsung: Sleep mode → Do not disturb → Allowed → Alarms ticked, HA not an allowed app; iOS needs
#   Critical Alerts allowed for the HA app.
# Wording (Tongai 2026-10-28): calm words, urgent delivery. The alarm channel and vibration carry the urgency; the words
# say who, where and what's needed. Nothing a person sees says panic, emergency, SOS or alarm, and nothing shouts.
# Buttons: Hannah (h-panic, binary_sensor.h_panic), Ellie (e-panic, binary_sensor.ellie_s_call_button_panic; 2026-10-29).
# Also: a quiet alert if a button is offline 10 min, and a monthly check reminder.
# Gate: input_boolean.panic_enabled (starts off, hard rule 6). Manual fallback: call or shout; the button only adds
# a phone alert. Owner: tanga (security, M2).

input_boolean:
  panic_enabled:
    name: Call buttons
    icon: mdi:bell-ring-outline
  panic_active_hannah:  # set by a press, cleared only by All sorted: the button itself reads on only while held
    name: Hannah's call active
    icon: mdi:bell-ring
  panic_active_ellie:
    name: Ellie's call active
    icon: mdi:bell-ring
  notify_mojgan:  # Tongai 2026-10-27: no pushes to Mojgan's phone until he says (starts off)
    name: Mojgan alerts
    icon: mdi:cellphone-message

# Family → Security: "I'm coming" for when the push was dismissed; "All sorted" turns the button's LED off and removes
# the alert from both phones.
input_button:
  panic_received_hannah:
    name: I'm coming
    icon: mdi:run-fast
  panic_clear_hannah:
    name: All sorted
    icon: mdi:check-circle-outline
  panic_received_ellie:
    name: I'm coming
    icon: mdi:run-fast
  panic_clear_ellie:
    name: All sorted
    icon: mdi:check-circle-outline

# What the Security tab shows (Tongai 2026-10-29: see at a glance which button has a live call and whether anyone has
# answered): "Calling" from each press, "Help coming" once a parent taps I'm coming (`who`: their name), "Quiet" after
# All sorted. Trigger-based so it remembers who answered (call_responded, fired by panic_received); restored on restart.
template:
  - triggers:
      - trigger: state
        entity_id: input_boolean.panic_active_hannah
        not_to: [unavailable, unknown]
      - trigger: event
        event_type: call_responded
        event_data:
          room: Hannah
      - trigger: event  # a press while a call is already live (the boolean stays on): unanswered again
        event_type: call_pressed
        event_data:
          room: Hannah
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: Hannah's call
        unique_id: call_hannah_state
        state: >-
          {% if not is_state('input_boolean.panic_active_hannah', 'on') %}Quiet
          {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}Help coming
          {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}Calling
          {% elif this.state == 'Help coming' %}Help coming
          {% else %}Calling{% endif %}
        icon: >-
          {% if not is_state('input_boolean.panic_active_hannah', 'on') %}mdi:bell-outline
          {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}mdi:run-fast
          {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}mdi:bell-ring
          {% elif this.state == 'Help coming' %}mdi:run-fast
          {% else %}mdi:bell-ring{% endif %}
        attributes:
          who: >-
            {% if not is_state('input_boolean.panic_active_hannah', 'on') %}
            {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}{{ trigger.event.data.who }}
            {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}
            {% else %}{{ this.attributes.who | default('', true) }}{% endif %}
  - triggers:
      - trigger: state
        entity_id: input_boolean.panic_active_ellie
        not_to: [unavailable, unknown]
      - trigger: event
        event_type: call_responded
        event_data:
          room: Ellie
      - trigger: event  # a press while a call is already live (the boolean stays on): unanswered again
        event_type: call_pressed
        event_data:
          room: Ellie
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: Ellie's call
        unique_id: call_ellie_state
        state: >-
          {% if not is_state('input_boolean.panic_active_ellie', 'on') %}Quiet
          {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}Help coming
          {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}Calling
          {% elif this.state == 'Help coming' %}Help coming
          {% else %}Calling{% endif %}
        icon: >-
          {% if not is_state('input_boolean.panic_active_ellie', 'on') %}mdi:bell-outline
          {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}mdi:run-fast
          {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}mdi:bell-ring
          {% elif this.state == 'Help coming' %}mdi:run-fast
          {% else %}mdi:bell-ring{% endif %}
        attributes:
          who: >-
            {% if not is_state('input_boolean.panic_active_ellie', 'on') %}
            {% elif trigger.platform == 'event' and trigger.event.event_type == 'call_responded' %}{{ trigger.event.data.who }}
            {% elif trigger.platform == 'state' and trigger.from_state is not none and trigger.from_state.state == 'off'
             or trigger.platform == 'event' and trigger.event.event_type == 'call_pressed' %}
            {% else %}{{ this.attributes.who | default('', true) }}{% endif %}

automation:
  # A button held 2 s: alert both parents, light the way, confirm on the button. Fallback: call or shout.
  - id: panic_pressed
    alias: Call button - pressed
    mode: parallel
    triggers:
      - trigger: state
        entity_id: binary_sensor.h_panic
        to: "on"
        id: hannah
        variables:
          room: Hannah
      - trigger: state
        entity_id: binary_sensor.ellie_s_call_button_panic  # e-panic (AtomS3 Lite, 2026-10-29)
        to: "on"
        id: ellie
        variables:
          room: Ellie
    conditions:
      - condition: state
        entity_id: input_boolean.panic_enabled
        state: "on"
    actions:
      - choose:  # remember the call until All sorted (the button itself reads on only while held)
          - conditions:
              - condition: trigger
                id: hannah
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.panic_active_hannah
          - conditions:
              - condition: trigger
                id: ellie
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.panic_active_ellie
      - event: call_pressed  # the Security card: Calling (red), even if a parent had answered an earlier press
        event_data:
          room: "{{ room }}"
      # Tongai first: the call fails only if his app isn't registered (then no green on the button)
      - action: notify.mobile_app_tongaism25
        data:
          title: "{{ room }} needs you"
          message: "{{ room }} pressed her call button at {{ now().strftime('%H:%M') }}."
          data:
            channel: alarm_stream  # the alarm stream: the urgency is in the delivery, not the words
            vibrationPattern: "0, 800, 300, 800, 300, 800, 300, 800"  # long and strong, for the watch and the phone
            priority: high
            ttl: 0
            tag: "panic_{{ trigger.id }}"
            clickAction: /family-home/call-check  # Android: a tap opens Family → Call check (M2-O F)
            url: /family-home/call-check  # iPhone: the same
            actions:
              - action: "CALL_SEEN_{{ trigger.id }}"
                title: I'm coming
      - choose:
          - conditions:
              - condition: trigger
                id: hannah
            sequence:
              - action: esphome.h_panic_panic_ack
                continue_on_error: true  # a button that dropped off mustn't stop the lamps and Mojgan
          - conditions:
              - condition: trigger
                id: ellie
            sequence:
              - action: esphome.e_panic_panic_ack
                continue_on_error: true  # a button that dropped off mustn't stop the lamps and Mojgan
      # then Mojgan and the lamps, side by side: a slow lamp or a missing iPhone can't hold up the green
      - parallel:
          - if:  # Mojgan alerts switch (off until Tongai says)
              - condition: state
                entity_id: input_boolean.notify_mojgan
                state: "on"
            then:
              - action: notify.mobile_app_mojgan_iphone  # Mojgan's iPhone (re-registered 2026-10-27; was mobile_app_iphone_32)
                continue_on_error: true
                data:
                  title: "{{ room }} needs you"
                  message: "{{ room }} pressed her call button at {{ now().strftime('%H:%M') }}."
                  data:
                    tag: "panic_{{ trigger.id }}"
                    clickAction: /family-home/call-check  # Android: a tap opens Family → Call check (M2-O F)
                    url: /family-home/call-check  # iPhone: the same
                    push:
                      sound:
                        name: default
                        critical: 1
                        volume: 1.0
                    actions:
                      - action: "CALL_SEEN_{{ trigger.id }}"
                        title: I'm coming
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.lamps_downstairs

  # A parent tapped "I'm coming": the button turns blue, and the other parent is told who is responding.
  # Fallback: tell them.
  - id: panic_received
    alias: Call button - I'm coming
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: CALL_SEEN_hannah
        id: hannah
        variables:
          room: Hannah
      - trigger: state
        entity_id: input_button.panic_received_hannah
        not_from: [unavailable]  # a press, not a reload or restart
        not_to: [unavailable]
        id: hannah
        variables:
          room: Hannah
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: CALL_SEEN_ellie
        id: ellie
        variables:
          room: Ellie
      - trigger: state
        entity_id: input_button.panic_received_ellie
        not_from: [unavailable]
        not_to: [unavailable]
        id: ellie
        variables:
          room: Ellie
    conditions:
      - condition: template  # a dashboard press: a button created or reloaded has no previous state
        value_template: >-
          {{ trigger.platform != 'state' or (trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable']) }}
      - condition: state
        entity_id: input_boolean.panic_enabled
        state: "on"
    actions:
      - variables:
          who: >-
            {%- set ctx = trigger.event.context if trigger.platform == 'event' else trigger.to_state.context -%}
            {{ states.person | selectattr('attributes.user_id', 'eq', ctx.user_id)
               | map(attribute='name') | first | default('A parent') }}
      - event: call_responded  # the Security card: Help coming, and who (first, so a failed push can't stop it)
        event_data:
          room: "{{ room }}"
          who: "{{ who }}"
      - action: notify.mobile_app_tongaism25
        continue_on_error: true
        data:
          title: "{{ who }} is responding to {{ room }}'s call"
          message: "{{ who }} tapped I'm coming."
          data:
            tag: "panic_{{ trigger.id }}"
            clickAction: /family-home/call-check  # Android: a tap opens Family → Call check (M2-O F)
            url: /family-home/call-check  # iPhone: the same
      - if:  # Mojgan alerts switch (off until Tongai says)
          - condition: state
            entity_id: input_boolean.notify_mojgan
            state: "on"
        then:
          - action: notify.mobile_app_mojgan_iphone
            continue_on_error: true
            data:
              title: "{{ who }} is responding to {{ room }}'s call"
              message: "{{ who }} tapped I'm coming."
              data:
                tag: "panic_{{ trigger.id }}"
                clickAction: /family-home/call-check  # Android: a tap opens Family → Call check (M2-O F)
                url: /family-home/call-check  # iPhone: the same
      - choose:  # the button last: an offline button mustn't stop the other parent hearing
          - conditions:
              - condition: trigger
                id: hannah
            sequence:
              - action: esphome.h_panic_panic_seen
                continue_on_error: true
          - conditions:
              - condition: trigger
                id: ellie
            sequence:
              - action: esphome.e_panic_panic_seen
                continue_on_error: true

  # All sorted (Family → Security): the button's LED off, the alert off both phones. Fallback: it goes off by itself
  # (green 30 s, blue 10 min).
  - id: panic_clear
    alias: Call button - all sorted
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_button.panic_clear_hannah
        not_from: [unavailable]  # a press, not a reload or restart
        not_to: [unavailable]
        id: hannah
      - trigger: state
        entity_id: input_button.panic_clear_ellie
        not_from: [unavailable]
        not_to: [unavailable]
        id: ellie
    conditions:
      - condition: template  # a dashboard press: a button created or reloaded has no previous state
        value_template: >-
          {{ trigger.platform != 'state' or (trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable']) }}
      - condition: state
        entity_id: input_boolean.panic_enabled
        state: "on"
    actions:
      - choose:  # the call is over
          - conditions:
              - condition: trigger
                id: hannah
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.panic_active_hannah
          - conditions:
              - condition: trigger
                id: ellie
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.panic_active_ellie
      - action: notify.mobile_app_tongaism25
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: "panic_{{ trigger.id }}"
      - if:  # Mojgan alerts switch (off until Tongai says)
          - condition: state
            entity_id: input_boolean.notify_mojgan
            state: "on"
        then:
          - action: notify.mobile_app_mojgan_iphone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: "panic_{{ trigger.id }}"
      - choose:  # the button last: the phones clear whatever the button's state
          - conditions:
              - condition: trigger
                id: hannah
            sequence:
              - action: esphome.h_panic_panic_clear
                continue_on_error: true
          - conditions:
              - condition: trigger
                id: ellie
            sequence:
              - action: esphome.e_panic_panic_clear
                continue_on_error: true

  # A button that has dropped off Wi-Fi can't call for help: tell Tongai (quiet). Fallback: the monthly check.
  - id: panic_button_offline
    alias: Call button - offline
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.h_panic
        to: unavailable
        for: {minutes: 10}
        variables: {room: Hannah, sensor: binary_sensor.h_panic}
      - trigger: state
        entity_id: binary_sensor.ellie_s_call_button_panic
        to: unavailable
        for: {minutes: 10}
        variables: {room: Ellie, sensor: binary_sensor.ellie_s_call_button_panic}
      - trigger: homeassistant  # already offline when HA starts: the 10-min timer would never fire
        event: start
        variables: {room: "", sensor: ""}
    conditions:
      - condition: state
        entity_id: input_boolean.panic_enabled
        state: "on"
    actions:
      - if:  # at HA start ESPHome is still connecting: look again in 2 min, not now (review)
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: {minutes: 2}
      - variables:
          offline: >-
            {% set buttons = {'Hannah': 'binary_sensor.h_panic', 'Ellie': 'binary_sensor.ellie_s_call_button_panic'} %}
            {% if sensor %}{{ [room] if states(sensor) == 'unavailable' else [] }}
            {% else %}{% set ns = namespace(out=[]) %}{% for r, e in buttons.items() if states(e) == 'unavailable' %}{% set ns.out = ns.out + [r] %}{% endfor %}{{ ns.out }}{% endif %}
      - repeat:
          for_each: "{{ offline }}"
          sequence:
            - action: notify.mobile_app_tongaism25
              data:
                title: "{{ repeat.item }}'s call button is offline"
                message: Check its power and Wi-Fi.
                data:
                  tag: "panic_offline_{{ repeat.item | lower }}"
                  channel: Home status
                  importance: low

  # First of the month: check each button (hold 2 s; green, then tap I'm coming for blue). Fallback: a calendar note.
  - id: panic_monthly_test
    alias: Call buttons - monthly check
    mode: single
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: template
        value_template: "{{ now().day == 1 }}"
      - condition: state
        entity_id: input_boolean.panic_enabled
        state: "on"
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: "Monthly check: the call buttons"
          message: "Hold each one for 2 s: it turns green and your phone alerts. Tap I'm coming and it turns blue."
          data:
            tag: panic_test
            channel: Home status
            importance: low
