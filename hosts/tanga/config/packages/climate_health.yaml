# Climate health watchdog (M1a step 2; decisions M1-E, M1-F, M1-H, M1-I).
# Tells Tongai when a heating/AC device stops reporting, when an integration needs signing in again, which batteries
# are getting low, and which SmartThings sensors (perimeter contacts, boiler pipe) have gone silent: on 2026-10-07
# several had been dead since August, one at 46% battery, so battery % alone is not a warning. Alerts only: nothing
# here controls a device. Notifications: quiet "Home status" channel (no sound), short enough to read on a watch.
# Gate: input_boolean.climate_health_enabled (starts off; hard rule 6). Manual fallback for everything here: the tado,
# Nest and SmartThings apps show the same device status.

input_boolean:
  climate_health_enabled:
    name: Climate health alerts
    icon: mdi:thermometer-alert
  # Internal: set when the "device unavailable" alert was sent, so "recovered" only follows a real alert.
  climate_health_alert_active:
    name: Climate health alert active
    icon: mdi:alert

template:
  - sensor:
      # Climate devices that are unavailable. Ignored: climate.pure_hot_cool (Dyson, owned by pamba per OWNERSHIP.md).
      # (climate.downstairs, a stale Nest duplicate of climate.downstairs_2, left the registry 2026-10-23.)
      - name: Climate devices unavailable
        unique_id: climate_health_devices_unavailable
        icon: mdi:thermometer-off
        state: >-
          {{ (states.climate | list + states.water_heater | list)
             | rejectattr('entity_id', 'in', ['climate.pure_hot_cool'])
             | selectattr('state', 'in', ['unavailable', 'unknown']) | list | count }}
        attributes:
          devices: >-
            {{ (states.climate | list + states.water_heater | list)
               | rejectattr('entity_id', 'in', ['climate.pure_hot_cool'])
               | selectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='name') | list | join(', ') }}
      # Battery-powered house devices under 25%. Left out, by exact device-name fragments (not loose substrings, so
      # e.g. an "upstairs" sensor is kept): phones, Macs, iPads, the solar battery, the UPS and the car.
      - name: Batteries low
        unique_id: climate_health_batteries_low
        icon: mdi:battery-alert
        state: >-
          {{ states.sensor | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | rejectattr('entity_id', 'search', 'iphone|ipad|_mbp|family_mac|tongaism25|tongaipix|tongai22|growatt_|inverter_|myups_|volvo_')
             | map(attribute='state') | select('is_number') | map('float') | select('lt', 25) | list | count }}
        attributes:
          devices: >-
            {% set ns = namespace(out=[]) %}
            {% for s in states.sensor
                 | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'battery')
                 | rejectattr('entity_id', 'search', 'iphone|ipad|_mbp|family_mac|tongaism25|tongaipix|tongai22|growatt_|inverter_|myups_|volvo_')
                 if s.state | is_number and s.state | float < 25 %}
              {% set ns.out = ns.out + [s.name ~ ' ' ~ (s.state | float | round(0) | int) ~ '%'] %}
            {% endfor %}
            {{ ns.out | join(', ') }}

      # SmartThings devices that have gone silent: every entity unavailable for 2 h+ (brief drop-outs, like the kitchen
      # contact's, don't alert), or nothing reported for 12 h (a starting
      # guess; tune once their normal check-in interval is known). Excludes the deprecated SmartThings Mudiki lock.
      # Known limit: an HA restart resets last_reported, so a device that died while still showing its last values
      # looks fresh for up to 12 h after a restart; devices SmartThings marks unavailable are caught regardless.
      - name: Devices silent
        unique_id: climate_health_devices_silent
        icon: mdi:access-point-network-off
        state: >-
            {% set ns = namespace(out=[]) %}
            {% for d in integration_entities('smartthings') | map('device_id') | reject('none') | unique %}
              {% set name = device_attr(d, 'name_by_user') or device_attr(d, 'name') %}
              {% set st = expand(device_entities(d) | reject('match', 'update\\.') | list) %}
              {% if st and name is not search('mudiki', ignorecase=True) %}
                {% set alive = st | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count %}
                {% set last = st | map(attribute='last_reported') | max %}
                {% set since = st | map(attribute='last_changed') | max %}
                {% if (alive == 0 and (now() - since).total_seconds() > 2 * 3600)
                      or (now() - last).total_seconds() > 12 * 3600 %}
                  {% set ns.out = ns.out + [name] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.out | count }}
        attributes:
          devices: >-
            {% set ns = namespace(out=[]) %}
            {% for d in integration_entities('smartthings') | map('device_id') | reject('none') | unique %}
              {% set name = device_attr(d, 'name_by_user') or device_attr(d, 'name') %}
              {% set st = expand(device_entities(d) | reject('match', 'update\\.') | list) %}
              {% if st and name is not search('mudiki', ignorecase=True) %}
                {% set alive = st | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count %}
                {% set last = st | map(attribute='last_reported') | max %}
                {% set since = st | map(attribute='last_changed') | max %}
                {% if (alive == 0 and (now() - since).total_seconds() > 2 * 3600)
                      or (now() - last).total_seconds() > 12 * 3600 %}
                  {% set ns.out = ns.out + [name] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}

      # SmartThings sync watch (trial from 2026-10-09, decision M1b-I: both boxes signed in to the same SmartThings
      # account). A frozen connection shows nothing wrong: entities keep their last values. Both boxes read the same
      # four busy sensors, so their values should match; pamba's arrive through the bridge (*_pamba). Values, not
      # update times, are compared, so a restart of either box can't fake or hide a freeze. States:
      #   in_sync / diverged (a temperature differs by more than 0.3 °C, or is a number on one side only; 2026-10-11:
      #   exact equality flagged a single missed 0.1–0.2 °C report though both boxes were live. The boiler pipe moves
      #   well past 0.3 °C whenever the heating runs, so a frozen box still shows within hours) / bridge_down (pamba's bridge heartbeat,
      #   rpi4 = pamba's bridge server_id, unchanged 15 min+ by tanga's clock, or pamba's sources gone) / no_data (no copies or no heartbeat yet:
      #   pamba's bridge files not in place).
      # stale_box: the side whose newest real report is older (best guess; a restart can mislead it).
      - name: SmartThings sync
        unique_id: climate_health_smartthings_sync
        icon: mdi:sync-alert
        state: >-
          {% set local = ['sensor.bathroom_window_temperature', 'sensor.landing_window_temperature',
                          'sensor.bay_window_temperature', 'sensor.boiler_temp_temperature'] %}
          {% set remote = ['sensor.bathroom_window_temperature_pamba', 'sensor.landing_window_temperature_pamba',
                           'sensor.bay_window_temperature_pamba', 'sensor.boiler_temp_temperature_pamba'] %}
          {% set mirrors = expand(remote) %}
          {% if mirrors | count == 0 %}no_data
          {% elif states.sensor.ha_bridge_rpi4_heartbeat is none %}no_data
          {% elif states.sensor.ha_bridge_rpi4_heartbeat.last_changed < now() - timedelta(minutes=15)
                  or state_attr('sensor.ha_bridge_rpi4_heartbeat', 'mirrors_live') | int(0) == 0 %}
            bridge_down
          {% else %}
            {% set ns = namespace(diverged=false) %}
            {% for i in range(local | count) %}
              {% set a, b = states(local[i]), states(remote[i]) %}
              {% if (a | is_number) != (b | is_number) %}{% set ns.diverged = true %}
              {% elif a | is_number and ((a | float - b | float) | abs | round(2)) > 0.3 %}{% set ns.diverged = true %}
              {% endif %}
            {% endfor %}
            {{ 'diverged' if ns.diverged else 'in_sync' }}
          {% endif %}
        attributes:
          stale_box: >-
            {% set gone = ['unavailable', 'unknown'] %}
            {% set t = expand('sensor.bathroom_window_temperature', 'sensor.landing_window_temperature',
                              'sensor.bay_window_temperature', 'sensor.boiler_temp_temperature')
                       | rejectattr('state', 'in', gone) | map(attribute='last_changed') | list %}
            {% set p = expand('sensor.bathroom_window_temperature_pamba', 'sensor.landing_window_temperature_pamba',
                              'sensor.bay_window_temperature_pamba', 'sensor.boiler_temp_temperature_pamba')
                       | rejectattr('state', 'in', gone)
                       | map(attribute='attributes.bridge_source_last_updated') | select('string')
                       | map('as_datetime', none) | reject('none') | list %}
            {{ 'tanga' if not t else 'pamba' if not p else ('pamba' if t | max > p | max else 'tanga') }}

automation:
  # A climate device has been unavailable for 15 minutes (would have caught tado's 2026-10-06 outage within the hour).
  # Critical alert: breaks through Do Not Disturb. Manual fallback: check the device in the tado/Nest app.
  - id: climate_health_device_unavailable
    alias: Climate health - device unavailable
    mode: single
    triggers:
      # One trigger only: the list changing (incl. the first outage) and staying so for 15 min.
      - trigger: state
        entity_id: sensor.climate_devices_unavailable
        attribute: devices
        for: {minutes: 15}
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      - condition: numeric_state
        entity_id: sensor.climate_devices_unavailable
        above: 0
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: Heating/AC offline
          message: "{{ state_attr('sensor.climate_devices_unavailable', 'devices') }} · 15 min"
          data:
            tag: climate_health_unavailable
            channel: Home status
            importance: low
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.climate_health_alert_active

  # All climate devices are back after an alert was sent: replace the alert so it doesn't linger. Manual fallback:
  # none needed.
  - id: climate_health_devices_recovered
    alias: Climate health - devices recovered
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.climate_devices_unavailable
        below: 1
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_health_alert_active
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.climate_health_alert_active
      - action: notify.mobile_app_tongaism25
        data:
          title: Heating/AC back
          message: All devices reporting
          data:
            tag: climate_health_unavailable
            channel: Home status
            importance: low

  # An integration needs signing in again (tado, Volvo, ...). HA raises a repair issue `config_entry_reauth_*` when a
  # sign-in lapses; this alerts straight away instead of when a room goes cold. Unverified until the next lapse.
  # Manual fallback: Settings → Repairs on the box.
  - id: climate_health_reauth_needed
    alias: Climate health - integration needs signing in
    mode: queued
    triggers:
      - trigger: event
        event_type: repairs_issue_registry_updated
        event_data:
          action: create
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      - condition: template
        value_template: "{{ trigger.event.data.issue_id is search('reauth') }}"
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: Sign-in needed
          message: "{{ trigger.event.data.issue_id | regex_replace('^config_entry_reauth_', '') | regex_replace('_[0-9A-Z]{20,}$', '') }} · tanga Repairs"
          data:
            tag: "reauth_{{ trigger.event.data.issue_id }}"
            channel: Home status
            importance: low

  # Daily battery digest at 08:00 (M1-F). Manual fallback: the device's own app.
  - id: climate_health_battery_digest
    alias: Climate health - daily battery digest
    mode: single
    triggers:
      - trigger: time
        at: "08:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      - condition: template
        value_template: "{{ states('sensor.batteries_low') | int(0) > 0 or states('sensor.devices_silent') | int(0) > 0 }}"
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: "Batt {{ states('sensor.batteries_low') }} low · {{ states('sensor.devices_silent') }} silent"
          message: >-
            {{ (state_attr('sensor.batteries_low', 'devices') or '') | replace(' Battery', '') | truncate(80) }}
            {{- ' · Silent: ' ~ ((state_attr('sensor.devices_silent', 'devices') or []) | join(', ') | truncate(60))
                if states('sensor.devices_silent') | int(0) > 0 else '' }}
          data:
            tag: climate_health_batteries
            channel: Home status
            importance: low

  # A SmartThings device newly went silent (unavailable 2 h+, or no report for 12 h; held 30 min): quiet alert, so a
  # dead sensor is replaced before it matters. Manual fallback: SmartThings app → device status.
  - id: climate_health_device_silent
    alias: Climate health - device went silent
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.devices_silent
        attribute: devices
        for: {minutes: 30}
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      # Ignore the jump from "no list" after a restart or reload, which would re-announce every silent device.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown']
             and trigger.from_state.attributes.devices is defined
             and (trigger.to_state.attributes.devices or []) | reject('in', trigger.from_state.attributes.devices)
                 | list | count > 0 }}
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: Sensor silent
          message: >-
            {{ (trigger.to_state.attributes.devices or [])
              | reject('in', trigger.from_state.attributes.devices or []) | join(', ') }} · check battery
          data:
            tag: climate_health_silent
            channel: Home status
            importance: low

  # The two boxes' SmartThings temperatures have differed (or the bridge copies stopped) for 2 h: quiet alert, once at the
  # 2 h mark (checked every 15 min, so a restart can't lose it; after a restart it may repeat once).
  # Manual fallback: open the SmartThings integration on the stale box; sign in again if it asks.
  - id: climate_health_smartthings_sync
    alias: Climate health - SmartThings temperatures differ between boxes
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.climate_health_enabled
        state: "on"
      - condition: template
        value_template: >-
          {% set s = states.sensor.smartthings_sync %}
          {{ s is not none and s.state in ['diverged', 'bridge_down']
             and timedelta(hours=2) <= now() - s.last_changed < timedelta(hours=2, minutes=15) }}
    actions:
      - action: notify.mobile_app_tongaism25
        data:
          title: >-
            {{ 'Bridge to pamba silent' if is_state('sensor.smartthings_sync', 'bridge_down')
               else 'SmartThings stuck on ' ~ state_attr('sensor.smartthings_sync', 'stale_box') }}
          message: >-
            {{ 'Bridge from pamba silent 2 h; SmartThings check paused' if is_state('sensor.smartthings_sync', 'bridge_down')
               else 'SmartThings temperatures differ between boxes for 2 h; reload SmartThings there' }}
          data:
            tag: climate_health_smartthings_sync
            channel: Home status
            importance: low
