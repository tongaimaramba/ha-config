input_boolean:
  phones_watch_enabled:  # gate for phones_watch (starts off; no initial, hard rule 6)
    name: Phone watch
    icon: mdi:cellphone-check

automation:
  # A quiet note to Tongai when a person's phone can't be found for 30 min (PLT-47): their pushes then go to the last
  # known service, which may be gone (re-registered, signed out, app removed). GATE input_boolean.phones_watch_enabled
  # (starts off). Manual fallback: the Companion app's settings on that phone; the person's device list in HA.
  - id: phones_watch
    alias: Phones - a person's phone can't be found
    mode: queued
    triggers:
      - trigger: template
        value_template: "{{ not state_attr('sensor.phone_tongai', 'found') }}"
        for: "00:30:00"
        variables: {who: Tongai}
      - trigger: template
        value_template: "{{ not state_attr('sensor.phone_mojgan', 'found') }}"
        for: "00:30:00"
        variables: {who: Mojgan}
      - trigger: template
        value_template: "{{ not state_attr('sensor.phone_hannah', 'found') }}"
        for: "00:30:00"
        variables: {who: Hannah}
      - trigger: template
        value_template: "{{ not state_attr('sensor.phone_ellie', 'found') }}"
        for: "00:30:00"
        variables: {who: Ellie}
    conditions:
      - condition: state
        entity_id: input_boolean.phones_watch_enabled
        state: "on"
    actions:
      - action: "{{ states('sensor.phone_tongai') }}"
        continue_on_error: true
        data:
          title: "{{ who }}'s phone can't be found"
          message: Pushes to {{ who }} may not arrive · check the Companion app on that phone
          data:
            tag: phones_watch
            channel: Home status
            importance: low
