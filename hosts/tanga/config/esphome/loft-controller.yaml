substitutions:
  device_name: "loft-controller"
  friendly_name: "Loft Controller"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Loft-Controller Fallback Hotspot"
    password: <redacted>

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: sk6812
    pin: GPIO27
    num_leds: 1
    name: "Loft Controller Status LED"
    id: status_led

binary_sensor:
  # Emergency Stop Button
  - platform: gpio
    pin: GPIO39
    name: "Atom Button"
    on_press:
      then:
        - cover.stop: loft_suite_blind
        - light.turn_on:
            id: status_led
            brightness: 100%
            red: 100%
            green: 0%
            blue: 0%
            effect: "Pulse"

  # -------------------------------------------------------------------------
  # Motion Sensors (Via Orange Plug A/B)
  # -------------------------------------------------------------------------
  - platform: gpio
    pin: 
      number: GPIO26  # Connected to Pad "A"
      mode: INPUT_PULLDOWN
    name: "Window Area"
    id: pir_window
    device_class: motion
    filters:
      - delayed_on: !lambda |-
          return id(delay_on_time).state * 1000;
      - delayed_off: !lambda |-
          return id(delay_off_time).state * 1000;
    on_state:
      then:
        - lambda: |-
            if (x) {
              id(presence_event).trigger("motion_detected_window");
            } else {
              id(presence_event).trigger("motion_cleared_window");
            }

  - platform: gpio
    pin: 
      number: GPIO32  # Connected to Pad "B"
      mode: INPUT_PULLDOWN
    name: "Bed Area"
    id: pir_bed
    device_class: motion
    filters:
      - delayed_on: !lambda |-
          return id(delay_on_time).state * 1000;
      - delayed_off: !lambda |-
          return id(delay_off_time).state * 1000;
    on_state:
      then:
        - lambda: |-
            if (x) {
              id(presence_event).trigger("motion_detected_bed");
            } else {
              id(presence_event).trigger("motion_cleared_bed");
            }

  # -------------------------------------------------------------------------
  # Door Sensor (Direct Solder Pad 33)
  # -------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO33       
      mode: INPUT_PULLUP
    name: "Bedroom Door"
    device_class: door
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: template
    name: "Person Present"
    id: raw_presence
    device_class: occupancy
    lambda: |-
      return id(pir_window).state || id(pir_bed).state;
    filters:
      - delayed_off: !lambda |-
          return id(presence_timeout).state * 1000;

# -------------------------------------------------------------------------
# Blind Control (Direct Solder Pads 19, 23, 22)
# -------------------------------------------------------------------------
sensor:
  - platform: template
    name: "Loft Suite Blind Position"
    id: blind_position
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return id(loft_suite_blind).position * 100.0f;

cover:
  - platform: time_based
    name: "Loft Suite Blind"
    id: loft_suite_blind
    device_class: blind
    open_action:
      - switch.turn_on: blind_up
      - delay: 500ms
      - switch.turn_off: blind_up
    close_action:
      - switch.turn_on: blind_down
      - delay: 500ms
      - switch.turn_off: blind_down
    stop_action:
      - switch.turn_on: blind_stop
      - delay: 500ms
      - switch.turn_off: blind_stop
    open_duration: 25s 
    close_duration: 25s 

switch:
  - platform: gpio
    pin: 
      number: GPIO19 # Pad 19
      inverted: true
      mode: output
    name: "Close - Loft Suite Blind"
    id: blind_down
    interlock: [blind_stop, blind_up]

  - platform: gpio
    pin: 
      number: GPIO23 # Pad 23
      inverted: true
      mode: output
    name: "Stop - Loft Suite Blind"
    id: blind_stop
    interlock: [blind_down, blind_up]

  - platform: gpio
    pin: 
      number: GPIO22 # Pad 22
      inverted: true
      mode: output
    name: "Open - Loft Suite Blind"
    id: blind_up
    interlock: [blind_stop, blind_down]   

number:
  - platform: template
    name: "${friendly_name} Timeout"
    id: presence_timeout
    min_value: 30
    max_value: 600
    step: 30
    initial_value: 60
    unit_of_measurement: "s"
    mode: box
    optimistic: true  
  - platform: template
    name: "${friendly_name} Delay-Off"
    id: delay_off_time
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 30
    unit_of_measurement: "s"
    mode: box
    optimistic: true
  - platform: template
    name: "${friendly_name} Delay-On"
    id: delay_on_time
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 1
    unit_of_measurement: "s"
    mode: box
    optimistic: true  

event:
  - platform: template
    name: "${friendly_name} Events"
    id: presence_event
    event_types:
      - "motion_detected_window"
      - "motion_cleared_window"
      - "motion_detected_bed"
      - "motion_cleared_bed"    