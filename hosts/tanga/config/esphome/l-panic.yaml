# Loft call button (2026-11-09, for whoever sleeps in the Loft suite): h-panic.yaml on the same hardware with its own keys. One
# self-contained file: tanga's esphome/ folder isn't deployed (the ESPHome dashboard owns it), so Tongai pastes it.
# Behaviour: hold 2 s → its sensor on; tanga (packages/panic.yaml) alerts and calls `panic_ack` (green); "I'm coming"
# calls `panic_seen` (blue, 10 min); All sorted calls `panic_clear` (off). Amber while held/sending; red flashing if
# not confirmed in 15 s or tanga isn't connected. No Bluetooth proxy: the button must stay reliable on Wi-Fi.
# HSE-9 (2026-11-09, carried over from h-panic in the 12 Nov rebase): `panic_waiting` (tanga, 60 s unanswered)
# shows amber, pulsing slowly, until blue or off.
# Manual fallback: call or shout; the button only adds a phone alert.
# Hardware: M5Stack AtomS3 Lite (ESP32-S3FN8: button GPIO41, WS2812 LED GPIO35; 13 Nov: the spare board is an S3). New device: first install
# by USB (dashboard "Plug into this computer" or ESPHome Web), then OTA. Secrets (ESPHome dashboard → Secrets, Tongai):
# l_panic_api_key (32 random bytes, base64: the dashboard's new-device key, or `openssl rand -base64 32`),
# l_panic_ota_password, l_panic_ap_password.
# Entity: with the friendly name below, ESPHome's "Panic" sensor should register as binary_sensor.loft_call_button_panic
# (as e-panic's became binary_sensor.ellie_s_call_button_panic); check after the first flash.
substitutions:
  device_name: l-panic
  friendly_name: Loft call button

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret l_panic_api_key
  actions:
    - action: panic_ack  # tanga calls this once the alert has gone out
      then:
        - if:  # a parent may already have answered
            condition:
              lambda: "return id(led_state) != 5;"
            then:
              - globals.set: {id: led_state, value: "3"}
              - script.execute: show
    - action: panic_seen  # a parent tapped "I'm coming" on the alert
      then:
        - globals.set: {id: led_state, value: "5"}
        - script.execute: show
    - action: panic_waiting  # HSE-9 N-F: tanga's 60 s repeat went out and no one has answered: amber, slow pulse
      then:
        - if:  # not over a press being held or sent, a newer press's green, or a parent's blue
            condition:
              lambda: "return id(led_state) != 1 && id(led_state) != 2 && id(led_state) != 5;"
            then:
              - globals.set: {id: led_state, value: "6"}
              - script.execute: show
    - action: panic_clear  # a parent pressed All sorted (Family → Security): LED off now (Tongai 2026-10-27)
      then:
        - globals.set: {id: led_state, value: "0"}
        - script.execute: show

ota:
  - platform: esphome
    password: !secret l_panic_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # mains-powered: answer fast
  ap:
    ssid: "L-Call Fallback Hotspot"
    password: !secret l_panic_ap_password

captive_portal:

globals:
  - id: fired  # a call went out (or failed) since the last press: a release mustn't clear its feedback
    type: bool
    initial_value: "false"
  - id: led_state  # 0 off, 1 holding, 2 waiting, 3 confirmed, 4 failed, 5 a parent has seen it, 6 still trying (HSE-9),
    # 7 live but can't reach tanga
    type: int
    initial_value: "0"
  - id: prev_state  # what the LED showed before a press: a short tap puts it back
    type: int
    initial_value: "0"
  - id: live_prev  # Tongai 19 Nov: the live colour to go back to when tanga is reachable again
    type: int
    initial_value: "0"
  - id: lost_s  # seconds a live call has been unable to reach tanga
    type: int
    initial_value: "0"

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    internal: true  # the button's own: not switchable from HA
    pin: GPIO35
    chipset: WS2812
    rgb_order: GRB
    num_leds: 1
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: Pulse
      - pulse:  # HSE-9: still trying, slower and softer than "sending"
          name: Slow pulse
          transition_length: 2s
          update_interval: 2s
          min_brightness: 10%
          max_brightness: 70%
      - strobe:  # red: the effect's own colours override the light's
          name: Strobe
          colors:
            - {state: true, brightness: 100%, red: 100%, green: 0%, blue: 0%, duration: 250ms}
            - {state: false, duration: 250ms}

script:
  - id: show  # the only thing that drives the LED
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(led_state) == 1;"
          then:  # holding: amber, steady
            - light.turn_on: {id: led, red: 100%, green: 60%, blue: 0%, brightness: 40%, effect: none}
      - if:
          condition:
            lambda: "return id(led_state) == 2;"
          then:  # sent, waiting for tanga: amber pulse; red if no confirmation in 15 s
            - light.turn_on: {id: led, red: 100%, green: 60%, blue: 0%, brightness: 100%, effect: Pulse}
            - delay: 15s
            - globals.set: {id: led_state, value: "4"}  # falls through to the next block
      - if:
          condition:
            lambda: "return id(led_state) == 3;"
          then:  # confirmed (Tongai 19 Nov): green, slow pulse, until the next colour or All sorted; off after 2 h
            - light.turn_on: {id: led, red: 0%, green: 100%, blue: 0%, brightness: 70%, effect: Slow pulse}
            - delay: 2h
            - globals.set: {id: led_state, value: "0"}
            - light.turn_off: led
      - if:
          condition:
            lambda: "return id(led_state) == 4;"
          then:  # didn't get through: red flashing for 20 s
            - light.turn_on: {id: led, red: 100%, green: 0%, blue: 0%, brightness: 100%, effect: Strobe}
            - delay: 20s
            - globals.set: {id: led_state, value: "0"}
            - light.turn_off: led
      - if:
          condition:
            lambda: "return id(led_state) == 5;"
          then:  # a parent has seen it: blue, pulsing, until All sorted (Tongai 19 Nov; was 10 min); off after 2 h
            - light.turn_on: {id: led, red: 0%, green: 30%, blue: 100%, brightness: 100%, effect: Pulse}
            - delay: 2h
            - globals.set: {id: led_state, value: "0"}
      - if:
          condition:
            lambda: "return id(led_state) == 6;"
          then:  # still trying (HSE-9): amber, slow pulse, until I'm coming (blue) or All sorted; off after 2 h
            # only in case tanga never sends either
            - light.turn_on: {id: led, red: 100%, green: 60%, blue: 0%, brightness: 70%, effect: Slow pulse}
            - delay: 2h
            - globals.set: {id: led_state, value: "0"}
      - if:
          condition:
            lambda: "return id(led_state) == 7;"
          then:  # a live call can't reach tanga (30 s without the API): red flashing until it can (Tongai 19 Nov)
            - light.turn_on: {id: led, red: 100%, green: 0%, blue: 0%, brightness: 100%, effect: Strobe}
      - if:
          condition:
            lambda: "return id(led_state) == 0;"
          then:
            - light.turn_off: led

# Tongai 19 Nov: the light is how the room knows the call is live, so a hang must show. While a call is live (green,
# blue or amber), 30 s without tanga's API turns it red flashing; when tanga is back the live colour returns. tanga
# also re-sends the colour when the button reconnects (packages/panic.yaml), in case the button itself restarted.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - lambda: "return id(led_state) == 3 || id(led_state) == 5 || id(led_state) == 6;"
              - not:
                  api.connected:
          then:
            - lambda: "id(lost_s) += 5;"
            - if:
                condition:
                  lambda: "return id(lost_s) >= 30;"
                then:
                  - lambda: "id(live_prev) = id(led_state); id(led_state) = 7; id(lost_s) = 0;"
                  - script.execute: show
          else:
            - lambda: "id(lost_s) = 0;"
      - if:
          condition:
            and:
              - lambda: "return id(led_state) == 7;"
              - api.connected:
          then:
            - lambda: "id(led_state) = id(live_prev);"
            - script.execute: show

binary_sensor:
  - platform: gpio  # the press itself: amber while held, so the person sees it's counting
    id: raw_button
    internal: true
    pin:
      number: GPIO41
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: 50ms
    on_press:
      - globals.set: {id: fired, value: "false"}
      - lambda: "id(prev_state) = id(led_state);"
      - globals.set: {id: led_state, value: "1"}
      - script.execute: show
    on_release:
      - if:
          condition:
            lambda: "return !id(fired);"
          then:  # let go before 2 s: nothing was sent; show what was showing (waiting stays waiting)
            - lambda: "id(led_state) = id(prev_state) == 1 ? 0 : id(prev_state);"
            - script.execute: show
  - platform: gpio
    id: panic
    name: "Panic"  # as on h-panic/e-panic: one naming scheme for every call button; display name set in HA
    device_class: safety
    pin:
      number: GPIO41
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: 2s  # held 2 s: no accidental presses (M2-I)
    on_press:
      - globals.set: {id: fired, value: "true"}
      - if:
          condition:
            api.connected:
              state_subscription_only: true  # tanga itself, not a log window
          then:
            - globals.set: {id: led_state, value: "2"}
          else:
            - globals.set: {id: led_state, value: "4"}
      - script.execute: show