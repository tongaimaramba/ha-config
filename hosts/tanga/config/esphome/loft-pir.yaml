substitutions:
  device_name: "loft-pir"  
  friendly_name: "Bedroom Presence"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Loft-Pir Fallback Hotspot"
    password: <redacted>

web_server:
  port: 80

esp32_ble_tracker:
  #scan_parameters:
   # interval: 1100ms
   # window: 1100ms
   # active: true
   # continuous: true

bluetooth_proxy:
  active: true


captive_portal:

# Sensor Configuration with Enhanced Debugging
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO9
      mode: INPUT_PULLDOWN
    name: "Window Area"
    id: pir_window
    device_class: motion
    filters:
      - delayed_on: !lambda |-
          return id(delay_on_time).state * 1000;
      - delayed_off: !lambda |-
          return id(delay_off_time).state * 1000;
    on_state:
      then:
        - lambda: |-
            if (x) {
              ESP_LOGD("DEBUG", "Window PIR: Motion DETECTED");
              id(presence_event).trigger("motion_detected_window");
            } else {
              ESP_LOGD("DEBUG", "Window PIR: Motion CLEARED");
              id(presence_event).trigger("motion_cleared_window");
            }

  - platform: gpio
    pin: 
      number: GPIO8
      mode: INPUT_PULLDOWN
    name: "Bed Area"
    id: pir_bed
    device_class: motion
    filters:
      - delayed_on: !lambda |-
          return id(delay_on_time).state * 1000;
      - delayed_off: !lambda |-
          return id(delay_off_time).state * 1000;
    on_state:
      then:
        - lambda: |-
            if (x) {
              ESP_LOGD("DEBUG", "Bed PIR: Motion DETECTED");
              id(presence_event).trigger("motion_detected_bed");
            } else {
              ESP_LOGD("DEBUG", "Bed PIR: Motion CLEARED");
              id(presence_event).trigger("motion_cleared_bed");
            }

  - platform: gpio
    pin:
      number: GPIO7       
      mode: INPUT_PULLUP   # Enables internal pull-up resistor
    name: "Bedroom Door"
    device_class: door     # Shows as "Open"/"Closed" in Home Assistant
    filters:
      - delayed_on: 20ms   # Debounce: must be open for 20ms to trigger "open"
      - delayed_off: 20ms  # Debounce: must be closed for 20ms to trigger "closed"

  - platform: template
    name: "Person Present"
    id: raw_presence
    device_class: occupancy
    lambda: |-
      return id(pir_window).state || id(pir_bed).state;
    filters:
      - delayed_off: !lambda |-
          return id(presence_timeout).state * 1000;

# Timeout configuration
number:
  - platform: template
    name: "${friendly_name} Timeout"
    id: presence_timeout
    min_value: 30
    max_value: 600
    step: 30
    initial_value: 60
    unit_of_measurement: "s"
    mode: box
    optimistic: true  
  - platform: template
    name: "${friendly_name} Delay-Off"
    id: delay_off_time
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 30
    unit_of_measurement: "s"
    mode: box
    optimistic: true
  - platform: template
    name: "${friendly_name} Delay-On"
    id: delay_on_time
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 1
    unit_of_measurement: "s"
    mode: box
    optimistic: true  

# Event system with detailed logging
event:
  - platform: template
    name: "${friendly_name} Events"
    id: presence_event
    event_types:
      - "motion_detected_window"
      - "motion_cleared_window"
      - "motion_detected_bed"
      - "motion_cleared_bed"
       