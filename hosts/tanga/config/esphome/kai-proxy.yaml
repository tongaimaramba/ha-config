esphome:
  name: kai-proxy
  friendly_name: kai_proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Kai-Proxy Fallback Hotspot"
    password: <redacted>

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 290ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO27  
    num_leds: 1
    chipset: WS2812
    name: "Front Door Status LED"