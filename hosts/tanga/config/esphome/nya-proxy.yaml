esphome:
  name: nya-proxy
  friendly_name: nya-proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Nya-Proxy Fallback Hotspot"
    password: <redacted>

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 290ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true

captive_portal:
    