esphome:
  name: c32-auth
  friendly_name: c32_auth

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
    


# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "C32-Auth Fallback Hotspot"
    password: <redacted>

captive_portal:

