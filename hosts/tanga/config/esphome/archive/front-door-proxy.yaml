esphome:
  name: zane-proxy
  friendly_name: zane-proxy
  
esp32:
  board: seeed_xiao_esp32s3 #esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Front-Door-Proxy"
    password: <redacted>

captive_portal:

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 290ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO48  # Correct pin for Seeed XIAO ESP32-S3
    num_leds: 1
    chipset: WS2812
    name: "Front Door Status LED"