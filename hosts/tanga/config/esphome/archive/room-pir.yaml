substitutions:
  device_name: "bedroom-presence"  
  friendly_name: "Bedroom Presence"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  - platform: esphome
    password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Room-Pir Fallback Hotspot"
    password: <redacted>

captive_portal:

# Sensor Configuration with Enhanced Debugging
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO9
      mode: INPUT_PULLDOWN
    name: "Window Area"
    id: pir_window
    device_class: motion
    filters:
      - delayed_on: 1s
      - delayed_off: 30s
    on_state:
      then:
        - lambda: |-
            if (x) {
              ESP_LOGD("DEBUG", "Window PIR: Motion DETECTED");
              id(presence_event).trigger("motion_detected_door");
            } else {
              ESP_LOGD("DEBUG", "Window PIR: Motion CLEARED");
              id(presence_event).trigger("motion_cleared_door");
            }

  - platform: gpio
    pin: 
      number: GPIO1
      mode: INPUT_PULLDOWN
    name: "Bed Area"
    id: pir_bed
    device_class: motion
    filters:
      - delayed_on: 1s
      - delayed_off: 45s
    on_state:
      then:
        - lambda: |-
            if (x) {
              ESP_LOGD("DEBUG", "Bed PIR: Motion DETECTED");
              id(presence_event).trigger("motion_detected_bed");
            } else {
              ESP_LOGD("DEBUG", "Bed PIR: Motion CLEARED");
              id(presence_event).trigger("motion_cleared_bed");
            }

  - platform: template
    name: "Person Present"
    id: raw_presence
    device_class: occupancy
    lambda: |-
      return id(pir_window).state || id(pir_bed).state;
    filters:
      - delayed_off: !lambda |-
          return id(presence_timeout).state * 1000;

# Timeout configuration
number:
  - platform: template
    name: "${friendly_name} Timeout"
    id: presence_timeout
    min_value: 30
    max_value: 600
    step: 30
    initial_value: 120
    unit_of_measurement: "s"
    mode: box
    optimistic: true  # Add this line

# Event system with detailed logging
event:
  - platform: template
    name: "${friendly_name} Events"
    id: presence_event
    event_types:
      - "motion_detected_door"
      - "motion_cleared_door"
      - "motion_detected_bed"
      - "motion_cleared_bed"

