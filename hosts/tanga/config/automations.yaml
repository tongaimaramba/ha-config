  description: ''
  triggers:
  - trigger: state
    entity_id:
    - select.growatt_sph_work_mode_priority
    from:
    id: Change to Battery First
    to: Battery first
  - trigger: state
    entity_id:
    - select.growatt_sph_work_mode_priority
    from:
    to: Load first
    id: Change to Load First
    enabled: false
  - trigger: state
    entity_id:
    - select.growatt_sph_work_mode_priority
    from:
    to: Grid first
    id: Change to Grid First
    enabled: false
  conditions:
  - condition: time
    after: 02:59:30
    before: 03:05:00
    enabled: true
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change to Battery First
      sequence:
      - repeat:
          sequence:
          - action: select.select_option
            metadata: {}
            data:
              option: Battery first
            target:
              entity_id: select.growatt_sph_work_mode_priority
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
              milliseconds: 0
          until:
          - condition: state
            entity_id: sensor.growatt_sph_device_mode
            state: Battery first
    - conditions:
      - condition: trigger
        id:
        - Change to Load First
      sequence:
      - action: notify.mobile_app_tongaism25
        metadata: {}
        data:
          message: 'Test: load first'
    - conditions:
      - condition: trigger
        id:
        - Change to Grid First
      sequence:
      - action: notify.mobile_app_tongaism25
        metadata: {}
        data:
          message: 'Test: grid first'
  mode: single
