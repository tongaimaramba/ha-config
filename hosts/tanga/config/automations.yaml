- id: '1764098343827'
  alias: Proxy to mock tap (combined, debounce, and reset)
  triggers:
  - entity_id:
    - binary_sensor.front_step_proxy
    - binary_sensor.front_door_proxy
    to: 'on'
    id: front_on
    trigger: state
  - entity_id:
    - binary_sensor.garage_step_proxy
    - binary_sensor.garage_door_proxy
    to: 'on'
    id: garage_on
    trigger: state
  - entity_id:
    - binary_sensor.front_step_proxy
    - binary_sensor.front_door_proxy
    to: 'off'
    id: front_off
    trigger: state
  - entity_id:
    - binary_sensor.garage_step_proxy
    - binary_sensor.garage_door_proxy
    to: 'off'
    id: garage_off
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: front_on
      - condition: state
        entity_id: input_boolean.mock_tap_front_door_cooldown
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.mock_tap_front_door
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.mock_tap_front_door_cooldown
        action: input_boolean.turn_on
      - delay: 00:00:{{ cooldown_duration }}
      - target:
          entity_id: input_boolean.mock_tap_front_door_cooldown
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id: garage_on
      - condition: state
        entity_id: input_boolean.mock_tap_garage_cooldown
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.mock_tap_garage
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.mock_tap_garage_cooldown
        action: input_boolean.turn_on
      - delay: 00:00:{{ cooldown_duration }}
      - target:
          entity_id: input_boolean.mock_tap_garage_cooldown
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id: front_off
      sequence:
      - target:
          entity_id: input_boolean.mock_tap_front_door
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id: garage_off
      sequence:
      - target:
          entity_id: input_boolean.mock_tap_garage
        action: input_boolean.turn_off
  mode: parallel
  variables:
    cooldown_duration: 10
