          brightness_pct: 40
      else:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: input_select.work_status
            state: unavailable
          - condition: state
            entity_id: input_select.work_status
            state: unknown
          - condition: state
            entity_id: input_select.work_status
            state: Not working, yay!
        then:
        - service: light.turn_off
