- id: '1752418503015'
  alias: AC Energy Saver Ignore Handler
  description: Handles ignore actions and auto-resets ignore status
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: IGNORE_AC_WARNING
    trigger: event
  - minutes: /1
    trigger: time_pattern
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''event'' }}'
      sequence:
      - target:
          entity_id: input_datetime.ignore_until
        data:
          datetime: '{{ (now() + timedelta(hours=1)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
        action: input_datetime.set_datetime
      - target:
          entity_id: input_boolean.ignore_ac_automation
        action: input_boolean.turn_on
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          title: Snoozing AC Warning
          message: OK! Leaving AC running - I won't check again for an hour
      - action: notify.all_phones
        data:
          title: Snoozing AC Warning
          message: OK! Leaving AC running - I won't check again for an hour
        enabled: true
      alias: If "Ignore" button was pressed
    - conditions:
      - condition: template
        value_template: '{{ ignore_expired }}'
        alias: When "snooze" expires
      sequence:
      - target:
          entity_id: input_boolean.ignore_ac_automation
        action: input_boolean.turn_off
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          title: Snooze Over
          message: Snooze expired - back to watching for AC waste
    default: []
  mode: queued
  variables:
    ignore_expired: "{{ states('input_boolean.ignore_ac_automation') == 'on' and\n
      \  as_timestamp(now()) > as_timestamp(states('input_datetime.ignore_until'))
      }}\n"
- id: '1752418581260'
  alias: AC Energy Saver Automation
  description: Combined automation for AC energy saving scenarios
  triggers:
  - entity_id:
    - binary_sensor.loft_pir_person_present
    for:
      minutes: 1
    trigger: state
    from: 'on'
    to: 'off'
    id: Room Empty
  - minutes: /5
    trigger: time_pattern
  - trigger: state
    entity_id:
    - binary_sensor.loft_pir_bedroom_door
    from: 'off'
    to: 'on'
    id: Door Opened
  - trigger: state
    entity_id:
    - climate.loft_suite_ac
    from: 'off'
    to: cool
    id: AC Cooling
  - trigger: state
    entity_id:
    - climate.loft_suite_ac
    from: 'off'
    to: heat
    id: AC Heating
  conditions:
  - condition: time
    after: 07:00:00
    before: '20:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ac_on }}'
        alias: AC is on
      - condition: template
        value_template: '{{ no_presence }}'
        alias: no presence
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(state_attr(''climate.loft_suite_ac'',
          ''last_changed'')) > 900 }}'
        alias: 15 mins passed since AC state last change
      - condition: template
        value_template: '{{ not scenario1_active }}'
        alias: Scenario 1 is not active
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" is not active'
      sequence:
      - target:
          entity_id: light.scenario_1_light
        action: light.turn_on
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: AC has been on for 15 minutes but it looks like no one is in the
            room.  If you want to keep the AC going, press "Snooze",  or else press
            "Open Homeassistant" to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
      - action: notify.all_phones
        data:
          message: AC has been on for 15 minutes but it looks like no one is in the
            room.  If you want to keep the AC going, press "Snooze",  or else press
            "Open Homeassistant" to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
        enabled: true
      alias: ac on and no presence
    - conditions:
      - condition: template
        value_template: '{{ scenario1_active }}'
        alias: scenario 1 is active
      - condition: template
        value_template: '{{ ac_on }}'
        alias: AC is on
      - condition: template
        value_template: '{{ no_presence }}'
        alias: no presence
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(state_attr(''light.scenario_1_light'',
          ''last_changed'')) > 300 }}'
        alias: After 5 mins option 1 is still true
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" is not active'
      sequence:
      - target:
          entity_id: climate.loft_suite_ac
        action: climate.turn_off
        data: {}
      - target:
          entity_id: light.scenario_1_light
        action: light.turn_off
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
      - action: notify.all_phones
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
        enabled: true
      alias: after 5 mins scenario 1 is still true. (option 1) - turn off ac
    - conditions:
      - condition: template
        value_template: '{{ ac_on }}'
        alias: AC is on
      - condition: template
        value_template: '{{ door_open }}'
        alias: door is open
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(state_attr(''climate.loft_suite_ac'',
          ''last_changed'')) > 300 }}'
        alias: its been more than 5 mins since ac changed state
      - condition: template
        value_template: '{{ not scenario2_active }}'
        alias: scenario 2 is not active
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" is not active'
      sequence:
      - target:
          entity_id: light.scenario_2_light
        action: light.turn_on
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: AC has been on for 5 minutes with the door open. If you want to
            keep the AC going, press "Snooze",  or else press "Open Homeassistant"
            to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
      - action: notify.all_phones
        data:
          message: AC has been on for 5 minutes with the door open. If you want to
            keep the AC going, press "Snooze",  or else press "Open Homeassistant"
            to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
        enabled: true
      alias: ac on and door open
    - conditions:
      - condition: template
        value_template: '{{ scenario2_active }}'
        alias: scenario 2 is active
      - condition: template
        value_template: '{{ ac_on }}'
        alias: AC is on
      - condition: template
        value_template: '{{ door_open }}'
        alias: door is open
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(state_attr(''light.scenario_2_light'',
          ''last_changed'')) > 300 }}'
        alias: Scenario 2 has been active for 5 mins
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" is not active'
      sequence:
      - target:
          entity_id: climate.loft_suite_ac
        action: climate.turn_off
        data: {}
      - target:
          entity_id: light.scenario_2_light
        action: light.turn_off
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
      - action: notify.all_phones
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
        enabled: true
      alias: after 5 mins scenario 2 is still true. (option 3) - turn off ac
    - conditions:
      - condition: trigger
        id:
        - AC Cooling
        - AC Heating
      - condition: state
        entity_id: binary_sensor.loft_pir_bedroom_door
        state: 'on'
      - condition: template
        value_template: '{{ not scenario3_active }}'
        alias: scenario 3 is not active
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" not active'
      sequence:
      - target:
          entity_id: light.scenario_3_light
        action: light.turn_on
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: The bedroom door is open but you turned the AC on. If you want
            to keep the AC going, press "Snooze",  or else press "Open Homeassistant"
            to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
      - action: notify.all_phones
        data:
          message: The bedroom door is open but you turned the AC on. If you want
            to keep the AC going, press "Snooze",  or else press "Open Homeassistant"
            to stop the AC.
          data:
            actions:
            - action: URI
              title: Open Homeassistant
              uri: /dashboard-basics/ac-control
            - action: IGNORE_AC_WARNING
              title: Snooze
        enabled: true
      alias: door is open and ac just turned on
    - conditions:
      - condition: template
        value_template: '{{ scenario3_active }}'
        alias: scenario 3 is active
      - condition: template
        value_template: '{{ ac_on }}'
        alias: AC is on
      - condition: template
        value_template: '{{ door_open }}'
        alias: door is open
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(state_attr(''light.scenario_3_light'',
          ''last_changed'')) > 300 }}'
        alias: Its been 5 mins since scenario 3 started
      - condition: template
        value_template: '{{ not ignore_active }}'
        alias: '"ignore" not active'
      sequence:
      - target:
          entity_id: climate.loft_suite_ac
        action: climate.turn_off
        data: {}
      - target:
          entity_id: light.scenario_3_light
        action: light.turn_off
        data: {}
      - action: notify.mobile_app_tongaism25
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
      - action: notify.all_phones
        data:
          message: Turned off the AC because it seemed like it was on by mistake.
        enabled: true
      alias: after 5 mins scenario 2 is still true. (option 3) - turn off ac
    default: []
  mode: queued
  max: 10
  variables:
    scenario1_active: '{{ states(''light.scenario_1_light'') == ''on'' }}'
    scenario2_active: '{{ states(''light.scenario_2_light'') == ''on'' }}'
    scenario3_active: '{{ states(''light.scenario_3_light'') == ''on'' }}'
    ac_on: '{{ states(''climate.loft_suite_ac'') == ''on'' }}'
    door_open: '{{ states(''binary_sensor.loft_pir_bedroom_door'') == ''on'' }}'
    no_presence: '{{ states(''binary_sensor.loft_pir_person_present'') == ''off''
      }}'
    ignore_active: "{{ states('input_boolean.ignore_ac_automation') == 'on' and\n
      \  as_timestamp(now()) < as_timestamp(states('input_datetime.ignore_until'))
      }}\n"
