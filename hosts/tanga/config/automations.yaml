      - action: esphome.fp_delete_all_fingerprints
        data: {}
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: ''
        action: input_text.set_value
      - data:
          metadata: ''
        action: esphome.fp_set_metadata
