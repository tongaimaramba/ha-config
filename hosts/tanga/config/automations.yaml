          message: 'Unlocking Garage door for {{ trigger.event.data.fingerprint_name
            }} with {{ trigger.event.data.fingerprint_finger }}  at {{as_datetime(trigger.event.data.time).astimezone().strftime(''%H:%M'')
            if trigger.event.data.time is defined else now().astimezone().strftime(''%H:%M'')
            }}.

            '
        enabled: true
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: /Homeassistant/Auto_Unlock/Status
          payload: green
        enabled: false
      - action: lock.unlock
        metadata: {}
        data: {}
        target:
          entity_id: lock.mudiki
        enabled: true
      - action: light.turn_on
        metadata: {}
        data:
          rgb_color:
          - 0
          - 255
          - 0
        target:
          entity_id: light.kitchen_worktop
        enabled: false
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
        enabled: false
      - action: light.turn_on
        metadata: {}
        data:
          color_temp: 343
        target:
          entity_id: light.kitchen_worktop
        enabled: false
    - conditions:
      - condition: trigger
        id:
        - Denied
      sequence:
      - action: notify.mobile_app_tongai_s22
        metadata: {}
        data:
          title: FP Unlock FAILED
          message: Attempted unlock failed because {{ trigger.event.data.reason }}
            at {{ (as_datetime(trigger.event.data.time).astimezone().strftime('%H:%M')  if
            trigger.event.data.time is defined  else now().astimezone().strftime('%H:%M'))
            }}. By {{ trigger.event.data.fingerprint_name | default('unknown') }}  with
            {{ trigger.event.data.fingerprint_finger | default('') }}.
        enabled: true
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: /Homeassistant/Auto_Unlock/Status
          payload: red
        enabled: true
    - conditions:
      - condition: trigger
        id:
        - Pending
      sequence:
      - action: notify.mobile_app_tongai_s22
        metadata: {}
        data:
          title: FP Unlock In Progress
          message: '{{ states(''sensor.fp_auth_fp_status'') }}

            '
        enabled: false
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: /Homeassistant/Auto_Unlock/Status
          payload: amber
        enabled: true
    - conditions:
      - condition: trigger
        id:
        - Lockout
      sequence:
      - action: notify.mobile_app_tongai_s22
        metadata: {}
        data:
          title: FP LOCKOUT
          message: Lockout. Last issue {{ trigger.event.data.reason }} at {{ as_datetime(trigger.event.data.remaining).astimezone().strftime('%H:%M')
            if trigger.event.data.time is defined else now().astimezone().strftime('%H:%M')
            }}.
        enabled: true
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: /Homeassistant/Auto_Unlock/Status
          payload: red
        enabled: false
  mode: single
- id: '1749894430384'
  alias: Fingerprint Enrollment Management
  description: ''
  triggers:
  - entity_id:
    - input_button.enroll_fingerprint
    trigger: state
    from:
    to:
    id: Enroll
  - entity_id:
    - input_button.delete_fingerprint
    trigger: state
    from:
    to:
    id: DeleteSingle
  - entity_id:
    - input_button.delete_all_fingerprints
    trigger: state
    from:
    to:
    id: DeleteAll
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
