- id: '1703934406917'
  alias: 'Work Status '
  description: ''
  trigger:
  - platform: state
    entity_id:
    - input_select.work_status
    from:
    to:
  condition: []
  action:
  - if:
    - condition: state
      entity_id: input_select.work_status
      state: At work
    then:
    - service: light.turn_on
      data:
        color_name: green
        brightness_pct: 60
      target:
        entity_id: light.work_status_on_air_light
    - service: light.turn_on
      target:
        entity_id: light.loft32_desk_light
      data:
        color_name: green
        brightness_pct: 40
    else:
    - if:
      - condition: state
        entity_id: input_select.work_status
        state: Focus time
      then:
      - service: light.turn_on
        data:
          color_name: orange
          brightness_pct: 70
        target:
          entity_id: light.work_status_on_air_light
      - service: light.turn_on
        target:
          entity_id: light.loft32_desk_light
        data:
          color_name: darkorange
          brightness_pct: 40
      else:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: input_select.work_status
            state: unavailable
          - condition: state
            entity_id: input_select.work_status
            state: unknown
          - condition: state
            entity_id: input_select.work_status
            state: Not working, yay!
        then:
        - service: light.turn_off
          target:
            entity_id:
            - light.loft32_desk_light
            - light.work_status_on_air_light
          data: {}
        else:
        - if:
          - condition: state
            entity_id: input_select.work_status
            state: On a call
          then:
          - service: light.turn_on
            data:
              color_name: red
              brightness_pct: 80
            target:
              entity_id: light.work_status_on_air_light
          - service: light.turn_on
            target:
              entity_id: light.loft32_desk_light
            data:
              color_name: red
              brightness_pct: 40
  mode: single
