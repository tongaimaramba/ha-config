- id: '1656705377102'
  alias: Audio
  description: ''
  trigger:
  - device_id: 12f5a2396551d011ab4a5c841067b777
    domain: hue
    platform: device
    type: short_release
    subtype: 1
    unique_id: 2b3a26ba-ae72-4d6c-b3b0-466698b9181f
  condition: []
  action:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: media_player.projector
          attribute: sound_output
          state: soundbar
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.projector
          attribute: sound_output
          state: headphone
      sequence:
      - service: webostv.select_sound_output
        data:
          sound_output: headphone
          entity_id: media_player.projector
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.projector
          attribute: sound_output
          state: soundbar
      sequence:
      - service: webostv.select_sound_output
        data:
          entity_id: media_player.projector
          sound_output: soundbar
    default:
    - service: webostv.select_sound_output
      data:
        entity_id: media_player.projector
        sound_output: soundbar
  mode: single
