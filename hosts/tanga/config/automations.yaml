- id: '1709480751318'
  alias: Export optimiser
  description: ''
  triggers:
  - alias: End-window
    at: input_datetime.end_window
    id: End
    enabled: false
    trigger: time
  - at: input_datetime.start_window
    alias: Start-window
    id: Start
    enabled: false
    trigger: time
  - alias: Solar production less than house needs
    value_template: '{{ (float(states(''sensor.growatt_sph_pv_power''))-float(states(''sensor.growatt_sph_load_power'')))<100
      }}'
    for:
      hours: 0
      minutes: 0
      seconds: 10
    id: Importing
    trigger: template
  - value_template: '{{ (float(states(''sensor.growatt_sph_pv_power''))-float(states(''sensor.growatt_sph_load_power'')))>=100
      }}'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: Exporting
    trigger: template
    alias: Solar production more than house needs
  - event: sunset
    offset: -02:00:00
    id: Sunset
    trigger: sun
  - event: sunrise
    offset: 01:00:00
    id: Sunrise
    trigger: sun
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start
        - Sunrise
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: input_boolean.export_window
        action: input_boolean.turn_on
        alias: Enable window flag
    - conditions:
      - condition: trigger
        id:
        - End
        - Sunset
      sequence:
      - action: script.set_growatt_sph_mode_with_retry
        data:
          expected_mode: Load first
        alias: Change to Load First (mqtt)
      - target:
          entity_id: input_boolean.export_window
        data: {}
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id:
        - Importing
      - condition: state
        entity_id: input_boolean.export_window
        state: 'on'
      sequence:
      - action: script.set_growatt_sph_mode_with_retry
        data:
          expected_mode: Load first
        alias: Change to Load First (mqtt)
      alias: if there's not enough power from solar during export window then Load
        First
    - conditions:
      - condition: trigger
        id:
        - Exporting
      - condition: state
        entity_id: input_boolean.export_window
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.growatt_sph_battery_state_of_charge
        above: 55
      sequence:
      - action: script.set_growatt_sph_mode_with_retry
        data:
          expected_mode: Grid first
        alias: Change to Grid First (mqtt)
      alias: If there's too much power and battery is full then export
    default:
    - action: script.set_growatt_sph_mode_with_retry
      data:
        expected_mode: Load first
      alias: Change to Load First (mqtt)
  mode: single
