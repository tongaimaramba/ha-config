- id: '1749894430384'
  alias: Fingerprint Enrollment Management
  description: ''
  triggers:
  - entity_id:
    - input_button.enroll_fingerprint
    trigger: state
    from:
    to:
    id: Enroll
  - entity_id:
    - input_button.delete_fingerprint
    trigger: state
    from:
    to:
    id: DeleteSingle
  - entity_id:
    - input_button.delete_all_fingerprints
    trigger: state
    from:
    to:
    id: DeleteAll
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Enroll
      sequence:
      - action: script.auto_allocate_fingerprint_id
        data: {}
      - delay: 00:00:01
      - data:
          finger_id: '{{ states(''input_number.fp_enroll_id'')|int }}'
          num_scans: '{{ states(''input_number.fp_enroll_scans'')|int }}'
        action: esphome.fp_enroll
      - wait_for_trigger:
        - event_type: esphome.enrollment_done
          trigger: event
        timeout: 00:01:00
        continue_on_timeout: false
      - data:
          action: add
          record: '{{ states(''input_number.fp_enroll_id'')|int }}:{{ states(''input_text.fp_enroll_name'')
            }}:{{ states(''input_select.fp_enroll_finger'') }}'
        action: script.manage_fp_metadata
      - data:
          metadata: '{{ states(''input_text.fp_metadata_store'') }}'
        action: esphome.fp_set_metadata
      - target:
          entity_id: input_text.fp_enroll_name
        data:
          value: ''
        action: input_text.set_value
      - target:
          entity_id: input_select.fp_enroll_finger
        data:
          option: Left Index
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id:
        - DeleteSingle
      sequence:
      - data:
          finger_id: '{{ states(''input_number.fp_delete_id'')|int }}'
        action: esphome.fp_delete_fingerprint
      - data:
          action: delete
          record_id: '{{ states(''input_number.fp_delete_id'')|int }}'
        action: script.manage_fp_metadata
      - data:
          metadata: '{{ states(''input_text.fp_metadata_store'') }}'
        action: esphome.fp_set_metadata
    - conditions:
      - condition: trigger
        id:
        - DeleteAll
      sequence:
      - action: esphome.fp_delete_all_fingerprints
        data: {}
      - target:
          entity_id: input_text.fp_metadata_store
        data:
          value: ''
        action: input_text.set_value
      - data:
          metadata: ''
        action: esphome.fp_set_metadata
  mode: restart
