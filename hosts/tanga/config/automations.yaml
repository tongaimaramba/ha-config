- id: '1710089973439'
  alias: Battery First Scheduler
  description: ''
  triggers:
  - at: 03:00:00
    id: Start
    trigger: time
  - at: 05:30:00
    id: End
    trigger: time
  - entity_id:
    - sensor.volvo_eva_charging_system_status
    to: Charging
    id: Eva Charge Start
    trigger: state
  - trigger: state
    id: Eva Charge Stop
    entity_id:
    - sensor.volvo_eva_charging_system_status
    from: Charging
    to:
    - Idle
    - Done
    - Error
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start
      sequence:
      - action: script.set_growatt_sph_mode_with_retry
        data:
          expected_mode: Battery first
        alias: Change to Battery First (mqtt)
      - target:
          entity_id: input_boolean.battery_charging_window
        data: {}
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id:
        - End
      sequence:
      - action: script.set_growatt_sph_mode_with_retry
        data:
          expected_mode: Load first
        alias: Change to Load First (mqtt)
      - metadata: {}
        data: {}
        target:
          entity_id: input_boolean.battery_charging_window
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id:
        - Eva Charge Start
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.battery_charging_window
          state: 'off'
        then:
        - action: script.set_growatt_sph_mode_with_retry
          data:
            expected_mode: Load first
          alias: Change to Load First (mqtt)
        - metadata: {}
          data:
            title: Eva
            message: Eva started charging. Load First engaged. This isn't a house
              battery charging window
          action: notify.mobile_app_tongaism25
        else:
        - metadata: {}
          data:
            title: Eva
            message: Evie started charging. Battery First already engaged. This is
              a house battery charging window
          action: notify.mobile_app_tongaism25
    - conditions:
      - condition: trigger
        id:
        - Eva Charge Stop
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.battery_charging_window
          state: 'off'
        then:
        - alias: Change to Load First (mqtt)
          action: script.set_growatt_sph_mode_with_retry
          data:
            expected_mode: Load first
        - metadata: {}
          data:
            title: Eva
            message: Eva stopped charging. Load First engaged. This isn't a house
              battery charging window
          action: notify.mobile_app_tongaism25
        else:
        - action: script.set_growatt_sph_mode_with_retry
          data:
            expected_mode: Battery first
          alias: Change to Battery First (mqtt)
        - metadata: {}
          data:
            title: Eva
            message: Eva stopped charging. Battery First still needed. This is a house
              battery charging window
          action: notify.mobile_app_tongaism25
  mode: single
