        device_id: []
        area_id: []
      data:
        option: On a call
      action: input_select.select_option
    else:
    - if:
      - condition: state
        entity_id: binary_sensor.tongai_mbp_wk_focus
        state: 'on'
      then:
      - target:
          entity_id:
          - input_select.work_status
          device_id: []
          area_id: []
        data:
          option: Focus time
