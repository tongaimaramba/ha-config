aut:
  module: aut
  class: AUTApp
  plugin:
    - HASS
    - MQTT
  log: aut_log
  log_level: INFO
  window: 0.05    #window between data gathering for troubleshoot
  
  monitor_devices:
    - binary_sensor.monitor_tongai_phone
    - binary_sensor.monitor_mojgan_phone
    - binary_sensor.monitor_hannah_phone
    
  presence_sensors:
    tongai:
      monitor: binary_sensor.monitor_tongai_phone
      locator: sensor.tongai_locator
      tracker: device_tracker.tongai22
      person: person.tongai
    mojgan:
      monitor: binary_sensor.monitor_mojgan_phone
      locator: sensor.mojgan_locator
      tracker: device_tracker.mojgans_phone
      person: person.mojgan
    hannah:
      monitor: binary_sensor.monitor_hannah_phone
      locator: sensor.hannah_locator
      tracker: device_tracker.hannahs_iphone
      person: person.hannah
      
  rpi_connections:
    frontdoor_nw: device_tracker.frontdoor_nmap
    patio_nw: device_tracker.patio_nmap
    swings_nw: device_tracker.swings_nmap
    
  esp_commands:
    frontdoor:
      rpi_cycle: switch.rpi_rebooter_reboot_switch
      wlan_cycle: switch.rpi_rebooter_wlan0_restart
    
  api_call:
    username: user
    password: <redacted>
    ## api calls in Alias.py in Util folder
    mqtterr_url: "https://api.octopus.energy/v1/gas-meter-points/608682103/meters/E6S15330572061/consumption/"
    nw_url: "https://api.octopus.energy/v1/gas-meter-points/608682103/meters/E6S15330572061/consumption/"
    mon-proc_url: "https://xyz"
    hciconf_url: "https://abc"
    #Result for hciconf: ['hci1:', 'UP', 'RUNNING', 'hci0:', 'UP', 'RUNNING']
    #Result for mon-proc: ['ok']
    #Result for mon-proc: ['Missing processes: tongai.proc, other.net']
    #Result for mqtterr: Done - no output.

