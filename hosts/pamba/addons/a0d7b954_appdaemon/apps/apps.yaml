test_app:
  module: test_app
  class: TestApp
  plugin:
    - HASS
    - MQTT
  log: test_log
  log_level: INFO
  range_sensor: sensor.driveway_detector_driveway_distance_detector
  parking_light: light.driveway_detector_range_led
  led_timeout: 30    #how long does the LED stay on in the new state while Evie is parking (in seconds)
  snooze_time: 30
  ranges:
    parking_green: 1.2 #light will be orange above this and green below it
    parking_red: 0.85 #light will be green above this and red below it
    front_door: 0.15 #light will flash blue once below this and red up to "parking_red"
    
