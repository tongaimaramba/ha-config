boiler_alert:
  module: boiler_alert
  class: BOILERApp
  plugin:
    - HASS
    - MQTT
  log: boiler_alert
  log_level: INFO
  notif_device: all_android
  temp_sensor: sensor.boiler_temp_temperature_measurement
  heater_times:
    early: 5,30,6,30
    late: 17,30,18,30
 #   test1: 17,19,17,23
   # test2: 13,4,13,9
  #  test3: 13,13,13,28
  time_window: 30
  min_temp_rise: 4
  peak_temp_min: 27.5
  peak_temp_max: 31.5
  alert_ent: input_boolean.boiler_anomaly_alert
