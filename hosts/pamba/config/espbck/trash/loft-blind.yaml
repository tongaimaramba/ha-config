esphome:
  name: loft-blind
  friendly_name: loft-blind

esp8266:
  board: wemos_d1_mini32

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "xR4zhx0K5aqewQsRcO2+QYcA0z7Ls/wlhFr4clUBugk="

ota:
  password: <redacted>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Loft-Blind Fallback Hotspot"
    password: <redacted>

captive_portal:

# Control bedroom velux blind
switch:
  - platform: gpio
    pin: 
      number: D1
      inverted: True
   #   mode:
  #      output: True
   #     pullup: True
    name: "Close - Loft Suite Blind"
    id: blind_down
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: blind_down
  - platform: gpio
    pin: 
      number: D2
      inverted: True
   #   mode:
  #      output: True
  #      pullup: True
    name: "Stop - Loft Suite Blind"
    id: blind_stop
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: blind_stop
  - platform: gpio
    pin: 
      number: D4
      inverted: True
    #  mode:
    #    output: True
   #     pullup: True
    name: "Open - Loft Suite Blind"
    id: blind_up
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: blind_up   