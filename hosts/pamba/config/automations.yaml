  description: Automatically set work status at the start or end of a work session
  triggers:
  - entity_id:
    - sensor.study_presence_desk_sensor
    to:
    id: Active
    trigger: state
    enabled: false
  - type: distance
    device_id: 8fb5730a6cb28802e8fd8bc19c141a75
    entity_id: 4f688294beda58b4f4a6a930a36e8d93
