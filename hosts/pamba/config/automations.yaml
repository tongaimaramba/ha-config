    subtype: 1
    unique_id: 2b3a26ba-ae72-4d6c-b3b0-466698b9181f
  condition: []
  action:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: media_player.projector
          attribute: sound_output
          state: soundbar
      - condition: not
