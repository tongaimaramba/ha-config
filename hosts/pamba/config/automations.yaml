- id: '1760820131800'
  alias: Kitchen auto light
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.hue_motion_sensor_2_motion
    from:
    to: 'on'
    alias: Motion Detected
    id: Motion
  - alias: Detection clear
    trigger: state
    entity_id:
    - binary_sensor.hue_motion_sensor_2_motion
    to: 'off'
    for:
      hours: 0
      minutes: 20
      seconds: 0
    id: All Clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 06:00:00
        before: 08:00:00
      - condition: trigger
        id:
        - Motion
      - condition: state
        entity_id: light.kd_spots
        state: 'off'
      - condition: state
        entity_id: light.wall_lamps
        state: 'off'
      sequence:
      - alias: All lights on!
        action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 60
        target:
          entity_id:
          - light.kd_spots
          - light.wall_lamps
      alias: Winter morning
    - conditions:
      - condition: time
        after: 00:00:00
        before: 06:00:00
      - condition: trigger
        id:
        - Motion
      sequence:
      - alias: Night lights on
        action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 15
        target:
          entity_id: light.kitchen_spotlights
      alias: Night light
    - conditions:
      - condition: trigger
        id:
        - All Clear
      - condition: time
        after: 00:00:00
        before: 06:00:00
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.kd_spots
          - light.hall_spotlights
          - light.wall_lamps
      alias: ' Night light off - Turn off when no motion'
  mode: single
