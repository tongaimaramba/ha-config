        - 'Off'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.hue_lightstrip_plus_1
          - light.work_status_on_air_light
          - light.loft32_desk_light
      - action: climate.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: climate.study_ac
