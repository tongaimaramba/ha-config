          state: BenQ PD2710QC
        - condition: trigger
          id:
          - Laptop off
    then:
    - metadata: {}
      data:
        option: Not working, yay!
      target:
        entity_id: input_select.work_status
      action: input_select.select_option
    else:
    - if:
      - condition: or
        conditions:
        - condition: and
