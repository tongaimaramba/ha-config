- id: '1789556105052'
  alias: Garden D cleared - auto expire after 30 min
  description: Flag lapses back to off 30 minutes after being set, so a stale toggle
    can't be read as still-clear later.
  triggers:
  - entity_id: input_boolean.garden_d_cleared
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - delay:
      minutes: 30
  - target:
      entity_id: input_boolean.garden_d_cleared
    action: input_boolean.turn_off
  mode: restart
