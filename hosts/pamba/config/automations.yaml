  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - On-shelf
      sequence:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: light.hue_lightstrip_plus_1
    - conditions:
      - condition: trigger
        id:
        - Change
      sequence:
      - if:
        - condition: state
          entity_id: input_select.work_status
          state: Not working, yay!
        then:
        - action: input_select.select_option
          metadata: {}
          data:
            option: At work
          target:
            entity_id: input_select.work_status
        else:
        - target:
            entity_id: input_select.work_status
          data:
            cycle: true
          action: input_select.select_next
    - conditions:
      - alias: If triggered by AC
        condition: trigger
        id:
        - AC
      sequence:
      - action: climate.toggle
        metadata: {}
        data: {}
        target:
          entity_id: climate.study_ac
      - action: climate.set_temperature
        metadata: {}
        data:
          temperature: 20
          hvac_mode: auto
        target:
          entity_id: climate.study_ac
    - conditions:
      - condition: trigger
