          - condition: trigger
            id:
            - Active
          - condition: state
            entity_id: input_select.work_status
            state: Not working, yay!
      then:
      - target:
          entity_id: input_select.work_status
        data:
          option: At work
        action: input_select.select_option
  mode: single
