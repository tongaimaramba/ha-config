          attribute: sound_output
          state: soundbar
      sequence:
      - service: webostv.select_sound_output
        data:
          entity_id: media_player.projector
          sound_output: soundbar
    default:
    - service: webostv.select_sound_output
      data:
        entity_id: media_player.projector
        sound_output: soundbar
  mode: single
