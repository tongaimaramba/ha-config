- id: '1779736395156'
  alias: AC on with door open (all rooms)
  triggers:
  - entity_id: binary_sensor.closed_s
    to: 'on'
    for:
      minutes: 3
    id: s
    trigger: state
  - entity_id:
    - binary_sensor.closed_h
    to:
    - 'on'
    for:
      hours: 0
      minutes: 3
      seconds: 0
    id: h
    trigger: state
  - entity_id: binary_sensor.closed_e
    to: 'on'
    for:
      minutes: 3
    id: e
    trigger: state
  - entity_id: binary_sensor.closed_l
    to: 'on'
    for:
      minutes: 3
    id: l
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(climate_map[room]) != ''off'' }}'
  actions:
  - action: notify.mobile_app_tongaism25
    data:
      title: AC running, door open
      message: '{{ name_map[room] }}: AC is on but the door''s been open 3+ min.'
      data:
        tag: ac_alert_{{ room }}
  variables:
    room: '{{ trigger.id }}'
    climate_map:
      s: climate.study_ac
      h: climate.hannah_ac
      e: climate.ellie_ac
      l: climate.loft_suite_ac
    name_map:
      s: Study
      h: Hannah
      e: Ellie
      l: Loft
  mode: parallel
- id: '1779736476465'
  alias: AC on with room empty (all rooms)
  triggers:
  - entity_id: binary_sensor.pres_s
    to: 'off'
    for:
      minutes: 10
    id: s_day
    trigger: state
  - entity_id: binary_sensor.pres_h
    to: 'off'
    for:
      minutes: 10
    id: h_day
    trigger: state
  - entity_id: binary_sensor.pres_e
    to: 'off'
    for:
      minutes: 10
    id: e_day
    trigger: state
  - entity_id: binary_sensor.pres_l
    to: 'off'
    for:
      minutes: 10
    id: l_day
    trigger: state
  - entity_id: binary_sensor.pres_s
    to: 'off'
    for:
      minutes: 30
    id: s_night
    trigger: state
  - entity_id: binary_sensor.pres_h
    to: 'off'
    for:
      minutes: 30
    id: h_night
    trigger: state
  - entity_id: binary_sensor.pres_e
    to: 'off'
    for:
      minutes: 30
    id: e_night
    trigger: state
  - entity_id: binary_sensor.pres_l
    to: 'off'
    for:
      minutes: 30
    id: l_night
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(climate_map[room]) != ''off'' }}'
  - condition: template
    value_template: '{% set h = now().hour %} {% set night = (h >= 22) or (h < 7)
      %} {{ (is_night and night) or (not is_night and not night) }}'
  actions:
  - data:
      title: AC left running
      message: '{{ name_map[room] }}: AC is on but the room''s been empty {{ ''30+''
        if is_night else ''10+'' }} min.'
      data:
        tag: ac_alert_{{ room }}
    action: notify.mobile_app_tongaism25
  variables:
    room: '{{ trigger.id.split(''_'')[0] }}'
    is_night: '{{ trigger.id.endswith(''_night'') }}'
    climate_map:
      s: climate.study_ac
      h: climate.hannah_ac
      e: climate.ellie_ac
      l: climate.loft_suite_ac
    name_map:
      s: Study
      h: Hannah
      e: Ellie
      l: Loft
  mode: parallel
- id: '1779737140407'
  alias: AC on, room empty, door ALSO open (all rooms)
  triggers:
  - entity_id: binary_sensor.pres_s
    to: 'off'
    for:
      minutes: 10
    id: s_day
    trigger: state
  - entity_id: binary_sensor.pres_h
    to: 'off'
    for:
      minutes: 10
    id: h_day
    trigger: state
  - entity_id: binary_sensor.pres_e
    to: 'off'
    for:
      minutes: 10
    id: e_day
    trigger: state
  - entity_id: binary_sensor.pres_l
    to: 'off'
    for:
      minutes: 10
    id: l_day
    trigger: state
  - entity_id: binary_sensor.pres_s
    to: 'off'
    for:
      minutes: 30
    id: s_night
    trigger: state
  - entity_id: binary_sensor.pres_h
    to: 'off'
    for:
      minutes: 30
    id: h_night
    trigger: state
  - entity_id: binary_sensor.pres_e
    to: 'off'
    for:
      minutes: 30
    id: e_night
    trigger: state
  - entity_id: binary_sensor.pres_l
    to: 'off'
    for:
      minutes: 30
    id: l_night
    trigger: state
  - entity_id: binary_sensor.closed_s
    to: 'on'
    for:
      minutes: 2
    id: s_door
    trigger: state
  - entity_id: binary_sensor.closed_h
    to: 'on'
    for:
      minutes: 2
    id: h_door
    trigger: state
  - entity_id: binary_sensor.closed_e
    to: 'on'
    for:
      minutes: 2
    id: e_door
    trigger: state
  - entity_id: binary_sensor.closed_l
    to: 'on'
    for:
      minutes: 2
    id: l_door
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(climate_map[room]) != ''off'' }}'
  - condition: template
    value_template: '{{ is_state(''binary_sensor.pres_'' ~ room, ''off'') }}'
  - condition: template
    value_template: '{{ is_state(''binary_sensor.closed_'' ~ room, ''on'') }}'
  - condition: template
    value_template: "{% set h = now().hour %} {% set night = (h >= 22) or (h < 7)
      %} {% if trigger_kind == 'door' %}\n  true\n{% elif trigger_kind == 'night'
      %}\n  {{ night }}\n{% else %}\n  {{ not night }}\n{% endif %}"
  actions:
  - data:
      title: Heads up — door is ALSO open
      message: '{{ name_map[room] }}: AC on, room empty — and the door''s open too,
        so cold air''s escaping.'
      data:
        tag: ac_alert_{{ room }}
    action: notify.mobile_app_tongaism25
  variables:
    room: '{{ trigger.id.split(''_'')[0] }}'
    trigger_kind: '{{ trigger.id.split(''_'')[1] }}'
    climate_map:
      s: climate.study_ac
      h: climate.hannah_ac
      e: climate.ellie_ac
      l: climate.loft_suite_ac
    name_map:
      s: Study
      h: Hannah
      e: Ellie
      l: Loft
  mode: parallel
