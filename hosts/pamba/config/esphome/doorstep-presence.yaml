esphome:
  name: study-presence
  friendly_name: study presence

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  password: <redacted>
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Study-Presence"
    password: <redacted>

captive_portal:

#Study presence/distance detector
sensor:
  - platform: ultrasonic
    #D1 trig and D2 echo
    trigger_pin: 5
    echo_pin: 4
    name: "Desk Sensor"
    update_interval: 1s
    timeout: 1m 
    unit_of_measurement: "m"
    device_class: "distance"
    state_class: "measurement"
    accuracy_decimals: 2
 