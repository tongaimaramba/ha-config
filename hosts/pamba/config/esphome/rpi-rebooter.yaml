esphome:
  name: rpi-rebooter
  friendly_name: rpi_rebooter

esp32:
  board: wemos_d1_mini32
  

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  password: <redacted>
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rpi-Rebooter Fallback Hotspot"
    password: <redacted>

captive_portal:

switch:
    - platform: gpio
      pin: 16 
      id: rebooter
      name: "Reboot Switch"
      on_turn_on:
      - delay: 500ms
      - switch.turn_off: rebooter
    - platform: gpio
      pin: 17
      id: wlan
      name: "WLAN0 Restart"
      on_turn_on:
      - delay: 500ms
      - switch.turn_off: wlan
        



