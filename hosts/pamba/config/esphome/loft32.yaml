esphome:
  name: work-status
  friendly_name: work status

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: <redacted>

ota:
  password: <redacted>
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Works Status Fallback Hotspot"
    password: <redacted>

captive_portal:

light:
  - platform: neopixelbus
    variant: WS2811
    pin: GPIO21
    num_leds: 1
    name: "On-air Light" 
    method:
      type: esp32_rmt
      channel: 0
    
  - platform: neopixelbus
    type: RGB
    variant: WS2811
    pin: GPIO22
    num_leds: 1
    name: "Desk Light" 
    method:
      type: esp32_rmt
      channel: 1

# Control work status light
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO23
      mode:
        input: True
        pullup: True
      inverted: True
    name: "Desk Switch"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms