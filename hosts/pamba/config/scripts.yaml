manage_guest_access:
  alias: manage_guests
  icon: mdi:account
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.guest_access
        state: Add
      sequence:
      - data_template:
          message: 'the guest: {{states(''input_text.guest_name'')}} with MAC {{states(''input_text.mac_addr'')}}
            as {{states(''input_select.relationship'')}} just created'
        service: notify.all_android
      - data:
          value: 2
        entity_id: input_number.monitor_action
        service: input_number.set_value
      - event: run_guest_access
        event_data:
          name: run_guest_access
    - conditions:
      - condition: state
        entity_id: input_select.guest_access
        state: Remove
      sequence:
      - data_template:
          message: 'the guest: {{states(''input_text.guest_name'')}} with MAC {{states(''input_text.mac_addr'')}}
            as {{states(''input_select.relationship'')}} just removed'
        service: notify.all_android
      - data:
          value: 1
        entity_id: input_number.monitor_action
        service: input_number.set_value
      - event: run_guest_access
        event_data:
          name: run_guest_access
    default:
    - data_template:
        message: No action selected so nothing done. Select from "Add" or "Remove"
          and resubmit
      service: notify.all_android
    - data:
        value: 0
      entity_id: input_number.monitor_action
      service: input_number.set_value
