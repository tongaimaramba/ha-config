ignore_ac_automation_for_1_hour:
  alias: Ignore AC Automation for 1 Hour
  sequence:
  - target:
      entity_id: input_datetime.ignore_until
    data:
      datetime: '{{ (now() + timedelta(hours=1)).strftime(''%Y-%m-%d %H:%M:%S'') }}'
    action: input_datetime.set_datetime
  - target:
      entity_id: input_boolean.ignore_ac_automation
    action: input_boolean.turn_on
  - data:
      title: AC Automation Ignored
      message: Energy-saving scenarios disabled for 1 hour
    action: persistent_notification.create
  description: ''
reset_all_ac_flags:
  alias: Reset All AC Flags
  sequence:
  - target:
      entity_id:
      - light.scenario_1_light
      - light.scenario_2_light
      - light.scenario_3_light
    action: light.turn_off
  - target:
      entity_id: input_boolean.ignore_ac_automation
    action: input_boolean.turn_off
  - target:
      entity_id: input_datetime.ignore_until
    data:
      datetime: '1970-01-01 00:00:00'
    action: input_datetime.set_datetime
  description: ''
set_growatt_sph_mode_with_retry:
  alias: Set Growatt SPH Mode with Retry
  mode: single
  fields:
    expected_mode:
      description: Expected inverter mode/state, e.g. "Battery first".
      example: Battery first
      required: true
  variables:
    mqtt_topic: solar_assistant/inverter_1/work_mode_priority/set
    max_attempts: 3
    delay_seconds: 8
  sequence:
  - variables:
      attempt: 0
  - repeat:
      until:
      - condition: template
        value_template: '{{ states(''sensor.growatt_sph_device_mode'') == expected_mode
          or repeat.index >= max_attempts }}'
      sequence:
      - data:
          topic: '{{ mqtt_topic }}'
          payload: '{{ expected_mode }}'
          qos: 1
        action: mqtt.publish
      - wait_for_trigger:
        - platform: state
          entity_id: sensor.growatt_sph_device_mode
          to: '{{ expected_mode }}'
        timeout:
          seconds: '{{ delay_seconds }}'
        continue_on_timeout: true
  description: ''
set_growatt_mode_from_dropdown:
  alias: Set Growatt Mode From Dropdown
  sequence:
  - data:
      expected_mode: '{{ states(''input_select.inverter_mode'') }}'
    action: script.set_growatt_sph_mode_with_retry
  description: ''
