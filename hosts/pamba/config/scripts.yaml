        %}\n"
    action: notify.entity_log
  mode: single
  description: ''
oppy_mow_daily:
    alias: "Oppy - Daily mow (D-flag aware)"
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.garden_d_cleared
            state: "on"
        then:
          - service: navimow_pro.mow
            data:
              zones: [6, 16, 14, 3, 17]   # D first, then C2, C1, B, C3
              reset: true
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.garden_d_cleared
        else:
          - service: navimow_pro.mow
            data:
              zones: [16, 14, 3, 17]      # C2, C1, B, C3 — skirts D
              reset: true

oppy_mow_all:
    alias: "Oppy - Mow all zones (ad hoc)"
    mode: single
    sequence:
      - service: navimow_pro.mow
        data:
          zones: []                       # all zones, robot's own route
          reset: true

