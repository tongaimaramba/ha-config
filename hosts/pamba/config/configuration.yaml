cover:
  - platform: template
    covers:
      blind_left:
        device_class: blind
        unique_id: loft_blind
        friendly_name: Loft Blind
        value_template: ''
        open_cover:
          service: switch.turn_on
          entity_id: switch.blind_up
        close_cover:
          service: switch.turn_on
          entity_id: switch.blind_down
        stop_cover:
          service: switch.turn_on
          entity_id: switch.blind_stop
    
    
