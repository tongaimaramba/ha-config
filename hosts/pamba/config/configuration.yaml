    timeout: 30
    away_timeout: 120
  - platform: mqtt_room
    device_id: "apple:1006:10-11"
    name: 'Mojgan Phone'
    #state_topic: 'espresense/devices/apple:1006:10-11'
    state_topic: 'espresense/rooms'
    timeout: 30
    away_timeout: 120
  - platform: mqtt_room
    device_id: "apple:1006:10-12"
    name: 'Hannah Phone'
    #state_topic: 'espresense/devices/apple:1006:10-12'
    state_topic: 'espresense/rooms'
    timeout: 30
    away_timeout: 120
  - platform: mqtt_room
    device_id: "iBeacon:4ea4dc89-d22f-4f8e-9d1d-0908ad023fe7-100-1"
    name: 'Tongai s22 Phone'
    #state_topic: 'espresense/devices/iBeacon:4ea4dc89-d22f-4f8e-9d1d-0908ad023fe7-100-1'
