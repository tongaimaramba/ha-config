## Others on Arlo
#
#light:
#  - platform: aarlo
switch:
#  - platform: aarlo
#    siren: True
#    all_sirens: True
 #   snapshot: True
 #   siren_volume: 1
#    siren_duration: 10
  - platform: rpi_gpio 
    switches:
      - port: 4
        name: "Nuki Power"
        unique_id: "nuki_en_switch_port_4"
        invert_logic: true
#      - port: 17
#        name: "Lock Nuki"
#        unique_id: "nuki_lock_switch_port_17"
#        invert_logic: true
      - port: 22
        name: "Unlock Nuki"
        unique_id: "nuki_unlock_switch_port_22"
        invert_logic: true
      - port: 27
        name: "Open Nuki"
        unique_id: "nuki_open_switch_port_27"
        invert_logic: true
  - platform: momentary
    name: Empty House Trigger
    mode: on
    toggle_for: 1
    cancellable: True
# 
## Guest Access
#
input_text:
  guest_name:
    name: "Guest Name"
    icon: mdi:face
    initial: "guest_1"  
    min: 1
    max: 20
  mac_addr:
    name: "Bluetooth MAC Address"
    icon: mdi:bluetooth-audio
#    initial: ""
    min: 1
    max: 20
input_select:
  relationship:
    name: "Relationship"
    options:
      - Guest
      - Resident
    initial: "Guest"
    icon: mdi:face
  guest_access:
    name: "Manage Guest Access"
    options:
      - Add
      - Remove
      - Select
    initial: "Select"
    icon: mdi:key
input_number:
  monitor_action:
    name: Monitor Action
    initial: 0
    min: 0
    max: 2
    step: 1
    mode: box
    icon: mdi:server
#
#
## ac controller
light:
  - platform: template
    lights:
      scenario_1_light:
        friendly_name: "Scenario 1 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_1_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_1_light
      scenario_2_light:
        friendly_name: "Scenario 2 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_2_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_2_light
      scenario_3_light:
        friendly_name: "Scenario 3 Active"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.scenario_3_light
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.scenario_3_light
#
      loft_door_closed:
        friendly_name: "Loft Door Closed"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.loft_door_closed
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.loft_door_closed
            
      alexa_started_ac:
        friendly_name: "alexa_started_ac"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.alexa_started_ac
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.alexa_started_ac
